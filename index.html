<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private, offline money tracker. Your data stays on your phone.">
<meta name="theme-color" content="#F4F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
<title>Tally</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  /* apply the saved theme before first paint so there's no flash */
  try { var t = JSON.parse(localStorage.getItem('mt-theme') || '"system"'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" class="tabbar" aria-label="Main" hidden></nav>
</div>
<div id="layer"></div>
<div id="toast-root" aria-live="polite"></div>
<noscript><p style="padding:24px">Tally needs JavaScript turned on.</p></noscript>
<script src="js/util.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/smart.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/importer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
