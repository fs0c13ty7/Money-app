      let h = UI.subHeader('Recurring', `<button class="icon-btn filled press" data-act="new-rec" aria-label="Add recurring transaction">${ic('plus', 22, 2.2)}</button>`) + `<div class="stack">`;
      const active = S.rec.filter((r) => !r.paused).sort((a, b) => (a.nextDate < b.nextDate ? -1 : 1));
      const paused = S.rec.filter((r) => r.paused);
      if (!S.rec.length) {
        h += UI.empty('repeat', 'Nothing recurring yet', 'Add bills and subscriptions once and they’ll be logged automatically on their due date.', `<button class="btn btn-primary press" data-act="new-rec">${ic('plus', 18, 2.2)} Add recurring</button>`);
        return h + '</div>';
      }
      const out = active.filter((r) => r.type === 'expense').reduce((a, r) => a + S.monthlyEquivalent(r), 0);
      const inn = active.filter((r) => r.type === 'income').reduce((a, r) => a + S.monthlyEquivalent(r), 0);
      const next = active[0];
      h += `<section class="card pair"><div><span class="lbl">Out each month</span><span class="big">${U.fmt(out)}</span>${inn ? `<span class="tiny in">+${U.fmt(inn)} in</span>` : ''}</div>${next ? `<div class="divl"><span class="lbl">Next due</span><span class="mid">${esc(next.name)}</span><span class="tiny accent">${U.fmtDay(next.nextDate)} · in ${U.daysBetween(U.today(), next.nextDate)} day${U.daysBetween(U.today(), next.nextDate) === 1 ? '' : 's'}</span></div>` : ''}</section>`;
      h += `<h2 class="section-label">Active</h2><section class="card list-card">${active.length ? active.map(recRow).join('') : '<p class="muted pad">Everything is paused.</p>'}</section>`;
      if (paused.length) h += `<h2 class="section-label">Paused</h2><section class="card list-card">${paused.map(recRow).join('')}</section>`;
      h += `<p class="hint">${ic('info', 16, 1.9)} Each one is logged automatically on its due date, the next time you open the app.</p>`;
      return h + `</div>`;
    }
  };
  function recRow(r) {
    const c = S.cat(r.categoryId);
    const when = r.freq === 'weekly' ? 'weekly on ' + U.dowLong(r.nextDate) + 's' : r.freq === 'yearly' ? 'yearly on ' + U.fmtShortDate(r.nextDate) : 'monthly on the ' + U.ordinal(r.anchor);
    return `<button class="tx-row press${r.paused ? ' dim' : ''}" data-act="edit-rec" data-id="${esc(r.id)}">${UI.tile(c)}<span class="tx-main"><span class="tx-title">${esc(r.name)}</span><span class="tx-sub">${esc(c.name)} · ${when}</span></span><span class="tx-end"><span class="${r.type === 'income' ? 'amt in' : 'amt'}">${r.type === 'income' ? '+' : '−'}${U.fmt(r.amount)}</span><span class="tiny">${r.paused ? 'Paused' : U.fmtDay(r.nextDate)}</span></span></button>`;
  }
  A['new-rec'] = () => MT.sheets.recurringForm(null);
  A['edit-rec'] = (el) => MT.sheets.recurringForm(S.rec.find((r) => r.id === el.getAttribute('data-id')));

  /* ================= CATEGORIES ================= */
  UI.catState = { tab: 'expense', edit: false };
  V.categories = {
    render() {
      const st = UI.catState;
      let h = UI.subHeader('Categories', `<button class="btn btn-sm ${st.edit ? 'btn-primary' : 'btn-soft'} press" data-act="cat-edit" aria-pressed="${st.edit}">${st.edit ? 'Done' : 'Edit'}</button>`) + `<div class="stack">`;
      h += UI.seg('Category type', [{ id: 'expense', label: 'Expense · ' + S.catsOf('expense').length }, { id: 'income', label: 'Income · ' + S.catsOf('income').length }], st.tab, 'cat-tab');
      h += `<button class="btn btn-dashed press" data-act="cat-new">${ic('plus', 18, 2.2)} New ${st.tab} category</button>`;
      const month = U.monthStart(U.today());
      const counts = {};
      S.tx.forEach((t) => (counts[t.categoryId] = (counts[t.categoryId] || 0) + 1));
      h += `<section class="card list-card">`;
      h += S.catsOf(st.tab)
        .map((c) => {
          const n = counts[c.id] || 0;
          const sub = n ? n + ' transaction' + (n === 1 ? '' : 's') : 'Not used yet';
          const left = st.edit && !c.builtIn ? `<button class="minus press" data-act="cat-remove" data-id="${esc(c.id)}" aria-label="Remove ${esc(c.name)}"><span></span></button>` : '';
          const right = c.builtIn ? `<span class="badge">${ic('lock', 13, 2)} Built-in</span>` : st.edit ? '' : `<span class="chev">${ic('chevR', 18, 2)}</span>`;
          return `<div class="cat-row${st.edit ? ' editing' : ''}">${left}<button class="tx-row press" data-act="cat-open" data-id="${esc(c.id)}">${UI.tile(c)}<span class="tx-main"><span class="tx-title">${esc(c.name)}</span><span class="tx-sub">${sub}</span></span>${right}</button></div>`;
        })
        .join('');
      h += `</section><p class="hint">${ic('lock', 16, 1.9)} Built-in categories handle transfers and catch transactions from categories you remove, so they can’t be removed. You can still rename or recolour them.</p>`;
      void month;
      return h + `</div>`;
    }
  };
  A['cat-edit'] = () => {
    UI.catState.edit = !UI.catState.edit;
    UI.refresh();
  };
  A['cat-tab'] = (el) => {
    UI.catState.tab = el.getAttribute('data-val');
    UI.refresh();
  };
  A['cat-new'] = () => MT.sheets.categoryForm(null, UI.catState.tab);
  A['cat-open'] = (el) => MT.sheets.categoryForm(S.cats.find((c) => c.id === el.getAttribute('data-id')), UI.catState.tab);
  A['cat-remove'] = async (el) => {
    const c = S.cats.find((x) => x.id === el.getAttribute('data-id'));
    if (!c) return;
    const n = S.tx.filter((t) => t.categoryId === c.id).length;
    const fb = S.cat(S.fallbackFor(c.type)).name;
    const ok = await UI.confirm({
      title: 'Remove ' + c.name + '?',
      body: n ? `Nothing is deleted. Its ${n} transaction${n === 1 ? '' : 's'} move to <b>${esc(fb)}</b>, and you can undo straight after.` : `It hasn’t been used yet. You can undo straight after.`,
      ok: 'Remove',
      danger: true
    });
    if (!ok) return;
    try {
      const info = await S.removeCategory(c.id);
      UI.toast('Removed ' + c.name, {
        action: 'Undo',
        onAction: async () => {
          try {
            await S.undoRemoveCategory(info);
            UI.toast('Restored ' + c.name);
          } catch (e) {
            UI.error(e);
          }
        }
      });
    } catch (e) {
      UI.error(e);
    }
  };

  /* ================= ADJUST BALANCE ================= */
  V.adjust = {
    render() {
      const bal = S.balance();
      let h = UI.subHeader('Adjust balance') + `<div class="stack">`;
      h += `<p class="muted">Enter what your bank shows right now. The difference is logged as a balance adjustment, so your history still adds up. Adjustments don’t count as spending or income in your charts.</p>`;
      h += `<section class="card"><div class="set-row"><span class="set-text"><span class="lbl">Recorded in the app</span><b class="big">${U.fmt(bal)}</b></span><span class="tile c-blue">${ic('wallet', 20)}</span></div>`;
      h += `<label class="field-block" for="adj-in"><span class="lbl">Actual balance</span><span class="money-input"><span>£</span><input id="adj-in" inputmode="decimal" autocomplete="off" placeholder="${U.penceToInput(Math.abs(bal))}" enterkeyhint="done"></span></label>`;
      h += `<label class="field-inline" for="adj-neg"><input type="checkbox" id="adj-neg"${bal < 0 ? ' checked' : ''}> My account is overdrawn (minus)</label>`;
      h += `<div class="set-row bordered"><span class="lbl">Difference</span><b class="mid" id="adj-diff">—</b></div></section>`;
      h += `<div id="adj-preview"></div>`;
      h += `<label class="field" for="adj-note">${ic('note', 18, 1.9)}<input id="adj-note" placeholder="Note (optional)" autocomplete="off"></label>`;
      h += `<button class="btn btn-primary btn-lg press" data-act="adj-apply" id="adj-apply" disabled>Enter your balance</button></div>`;
      return h;
    },
    after(el) {
      const inp = el.querySelector('#adj-in');
      const neg = el.querySelector('#adj-neg');
      const upd = () => {
        const p = U.parseMoney(inp.value);
        const btn = el.querySelector('#adj-apply');
        const diffEl = el.querySelector('#adj-diff');
        const prev = el.querySelector('#adj-preview');
        if (p == null) {
          diffEl.textContent = inp.value.trim() ? 'Check the amount' : '—';
          prev.innerHTML = '';
          btn.disabled = true;
          btn.textContent = 'Enter your balance';
          UI.adjDiff = null;
          return;
        }
        const actual = neg.checked ? -p : p;
        const diff = actual - S.balance();
        UI.adjDiff = diff;
        diffEl.textContent = U.fmt(diff, { plus: true });
        diffEl.className = 'mid' + (diff > 0 ? ' in' : '');
        if (!diff) {
          prev.innerHTML = `<p class="note-box">Your balance already matches. Nothing to log.</p>`;
          btn.disabled = true;
          btn.textContent = 'Nothing to apply';
        } else {
          prev.innerHTML = `<h2 class="section-label">This will be logged as</h2><section class="card list-card"><div class="tx-row static"><span class="tile c-slate">${ic('sliders', 20)}</span><span class="tx-main"><span class="tx-title">Balance adjustment</span><span class="tx-sub">${diff < 0 ? 'Money out' : 'Money in'} · Today</span></span><span class="${diff > 0 ? 'amt in' : 'amt'}">${U.fmt(diff, { plus: true })}</span></div></section>`;
          btn.disabled = false;
          btn.textContent = 'Apply adjustment';
        }
      };
      inp.addEventListener('input', upd);
      neg.addEventListener('change', upd);
      upd();
    }
  };
  A['adj-apply'] = async (el) => {
    const diff = UI.adjDiff;
    if (!diff) return;
    el.disabled = true;
    try {
      const note = document.getElementById('adj-note').value;
      const t = await S.saveTx({ type: diff > 0 ? 'income' : 'expense', amount: Math.abs(diff), categoryId: 'adjust', name: 'Balance adjustment', note: note, date: U.today() });
      U.vibrate(10);
      UI.back();
      UI.toast('Balance updated to ' + U.fmt(S.balance()), {
        action: 'Undo',
        onAction: async () => {
          await S.deleteTx(t.id);
          UI.toast('Adjustment removed');
        }
      });
    } catch (e) {
      el.disabled = false;
      UI.error(e);
    }
  };

  /* ================= BACKUP ================= */
  V.backup = {
    render() {
      const last = S.meta.lastFileBackup;
      const fresh = last && Date.now() - last < 3 * 86400000;
      let h = UI.subHeader('Backup & restore') + `<div class="stack">`;
      h += `<section class="card center"><span class="tile tile-xl c-${fresh ? 'green' : 'amber'}">${ic(fresh ? 'shield' : 'alert', 30, 1.8)}</span><h2 class="card-title">${fresh ? 'Your data is backed up' : last ? 'Time for a fresh backup' : 'Save your first backup'}</h2><p class="muted sm">${last ? 'Last backup file: ' + U.ago(last) : 'No backup file yet'}</p><button class="btn btn-primary btn-lg press wide" data-act="backup-now">${ic('download', 18, 2)} Save backup file</button>${navigator.canShare ? `<button class="btn btn-soft press wide" data-act="backup-share">${ic('share', 18, 2)} Send backup to another app</button>` : ''}</section>`;
      h += `<h2 class="section-label">How your data is protected</h2><section class="card list-card">`;
      h += infoRow('phone', 'Saved the moment you tap Save', 'Every entry is written to this phone’s storage before the app says “Saved”.');
      h += infoRow('history', 'Daily snapshots inside the app', 'A copy is taken each day you use the app. The last 30 are kept below.');
      h += infoRow('file', 'Backup files you keep', 'A dated file saved to your phone’s Downloads folder, separate from the app. Keep a copy somewhere else too if you can.');
      h += `</section>`;
      h += `<h2 class="section-label">Restore or export</h2><section class="card list-card">`;
      h += `<label class="tx-row press" for="restore-file"><span class="tile c-blue">${ic('upload', 20)}</span><span class="tx-main"><span class="tx-title">Restore from a backup file</span><span class="tx-sub">You’ll see a preview before anything changes</span></span><span class="chev">${ic('chevR', 18, 2)}</span><input type="file" id="restore-file" accept="application/json,.json" class="sr"></label>`;
      h += `<label class="tx-row press" for="ml-file"><span class="tile c-orange">${ic('upload', 20)}</span><span class="tx-main"><span class="tx-title">Import from Money Lover</span><span class="tx-sub">Pick the CSV you exported. You’ll see a preview first</span></span><span class="chev">${ic('chevR', 18, 2)}</span><input type="file" id="ml-file" accept=".csv,text/csv,text/comma-separated-values" class="sr"></label>`;
      h += `<button class="tx-row press" data-act="export-csv"><span class="tile c-teal">${ic('file', 20)}</span><span class="tx-main"><span class="tx-title">Export as spreadsheet (CSV)</span><span class="tx-sub">Opens in Google Sheets or Excel</span></span><span class="chev">${ic('chevR', 18, 2)}</span></button>`;
      h += `</section><h2 class="section-label">Snapshots on this phone</h2><section class="card list-card" id="snap-list"><p class="muted pad">Loading…</p></section>`;
      return h + `</div>`;
    },
    after(el) {
      UI.bindImport(el);
      el.querySelector('#restore-file').addEventListener('change', async (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        try {
          const text = await f.text();
          let obj;
          try {
            obj = JSON.parse(text);
          } catch (err) {
            throw new Error('That file couldn’t be read. Pick a .json backup saved from this app.');
          }
          const v = S.validateImport(obj);
          if (!v.ok) throw new Error(v.error);
          MT.sheets.restorePreview(v, f.name);
        } catch (err) {
          UI.error(err);
        }
      });
      S.listSnapshots()
        .then((snaps) => {
          const box = el.querySelector('#snap-list');
          if (!box) return;
          if (!snaps.length) {
            box.innerHTML = `<p class="muted pad">The first snapshot is taken tomorrow, once you have some entries.</p>`;
            return;
          }
          box.innerHTML = snaps
            .map(
              (s) =>
                `<div class="tx-row static"><span class="tile c-slate">${ic(s.kind === 'daily' ? 'history' : 'shield', 20)}</span><span class="tx-main"><span class="tx-title">${s.kind === 'daily' ? U.fmtDay(U.iso(new Date(s.createdAt))) : 'Before restore · ' + U.fmtDay(U.iso(new Date(s.createdAt)))}</span><span class="tx-sub">${s.count} entries · balance ${U.fmt(s.balance)}</span></span><button class="btn btn-sm btn-soft press" data-act="snap-restore" data-id="${esc(s.id)}">Restore</button></div>`
            )
            .join('');
        })
        .catch(() => {});
    }
  };
  function infoRow(icon, title, body) {
    return `<div class="tx-row static top"><span class="tile c-blue tile-sm">${ic(icon, 18)}</span><span class="tx-main"><span class="tx-title">${esc(title)}</span><span class="tx-sub wrap">${esc(body)}</span></span></div>`;
  }
  function stamp() {
    const d = new Date();
    return U.iso(d) + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  }
  function backupBlob() {
    return new Blob([JSON.stringify(S.exportData(), null, 1)], { type: 'application/json' });
  }
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 1500);
  }
  A['backup-now'] = async () => {
    try {
      download(backupBlob(), 'money-tracker-backup-' + stamp() + '.json');
      await S.setMeta('lastFileBackup', Date.now());
      UI.toast('Backup file saved to Downloads');
      UI.refresh();
    } catch (e) {
      UI.error(e);
    }
  };
  A['backup-share'] = async () => {
    try {
      const file = new File([backupBlob()], 'money-tracker-backup-' + stamp() + '.json', { type: 'application/json' });
      if (!navigator.canShare || !navigator.canShare({ files: [file] })) throw new Error('Sharing files isn’t available here. Use “Save backup file” instead.');
      await navigator.share({ files: [file], title: 'Money Tracker backup' });
      await S.setMeta('lastFileBackup', Date.now());
      UI.toast('Backup sent');
      UI.refresh();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      UI.error(e);
    }
  };
  A['export-csv'] = () => {
    try {
      download(new Blob(['﻿' + S.toCSV()], { type: 'text/csv' }), 'money-tracker-' + U.today() + '.csv');
      UI.toast('Spreadsheet saved to Downloads');
    } catch (e) {
      UI.error(e);
    }
  };
  A['snap-restore'] = async (el) => {
    try {
      const snaps = await S.listSnapshots();
      const s = snaps.find((x) => x.id === el.getAttribute('data-id'));
      if (!s) throw new Error('That snapshot is no longer available.');
      const v = S.validateImport(s.data);
      if (!v.ok) throw new Error(v.error);
      MT.sheets.restorePreview(v, 'Snapshot from ' + U.fmtDay(U.iso(new Date(s.createdAt))));
    } catch (e) {
      UI.error(e);
    }
  };

  /* Money Lover import: read the file on the phone, then show a preview */
  UI.bindImport = (root) => {
    const inp = root.querySelector('#ml-file');
    if (!inp) return;
    inp.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try {
        if (/\.json$/i.test(f.name)) throw new Error('That’s a backup file. Use “Restore from a backup file” in Backup & restore instead.');
        const res = MT.importer.fromMoneyLover(await f.text());
        if (!res.ok) throw new Error(res.error);
        if (UI.sheets.length) await UI.closeSheet();
        MT.sheets.importPreview(res, f.name);
      } catch (err) {
        UI.error(err);
      }
    });
  };

  /* quick add & edit entry points */
  A['quick-add'] = (el) => {
    U.vibrate(6);
    const date = el && el.getAttribute && el.getAttribute('data-date');
    MT.sheets.txForm(null, date ? { date: date } : null);
  };
  A['edit-tx'] = (el) => {
    const t = S.tx.find((x) => x.id === el.getAttribute('data-id'));
    if (!t) return UI.toast('That entry no longer exists', { kind: 'error' });
    if (UI.route.name === 'search') UI.rememberSearch(UI.search.q);
    MT.sheets.txForm(t);
  };
})();

/* Money Tracker — bottom sheets: quick add / edit, recurring, category editor, first run, restore preview */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const S = MT.store;
  const X = MT.smart;
  const UI = MT.ui;
  const A = UI.actions;
  const esc = U.esc;
  const ic = U.icon;
  const M = (MT.sheets = {});

  const trimAmt = (p) => {
    const pounds = Math.floor(p / 100);
    const pp = p % 100;
    return pp ? pounds + '.' + String(pp).padStart(2, '0') : String(pounds);
  };

  /* ================= QUICK ADD / EDIT ================= */
  M.txForm = (existing, preset) => {
    const isEdit = !!existing;
    const st = {
      id: existing ? existing.id : null,
      type: existing ? existing.type : (preset && preset.type) || 'expense',
      amt: existing ? trimAmt(existing.amount) : '0',
      categoryId: existing ? existing.categoryId : null,
      catTouched: isEdit,
      name: existing ? existing.name : '',
      note: existing ? existing.note : '',
      date: existing ? existing.date : (preset && preset.date) || U.today(),
      repeat: false,
      saving: false,
      recurringId: existing ? existing.recurringId : null,
      parsed: null,
      nameSugs: []
    };
    const defaultCat = (type) => (S.catsByUse(type)[0] || S.cat(S.fallbackFor(type))).id;
    if (!st.categoryId) st.categoryId = defaultCat(st.type);
    let sheet = null;

    const catsHtml = () => {
      let list = S.catsByUse(st.type);
      if (!list.find((c) => c.id === st.categoryId)) list = [S.cat(st.categoryId)].concat(list);
      return list
        .map((c) => `<button type="button" class="chip cat-chip press${c.id === st.categoryId ? ' on' : ''}" data-act="qa-cat" data-id="${esc(c.id)}" aria-pressed="${c.id === st.categoryId}">${UI.tile(c, 'sm')}${esc(c.name)}</button>`)
        .join('');
    };
    const datesHtml = () => {
      const t = U.today();
      const y = U.addDays(t, -1);
      const custom = st.date !== t && st.date !== y;
      return `<button type="button" class="chip${st.date === t ? ' on' : ''}" data-act="qa-date" data-val="${t}" aria-pressed="${st.date === t}">Today</button><button type="button" class="chip${st.date === y ? ' on' : ''}" data-act="qa-date" data-val="${y}" aria-pressed="${st.date === y}">Yesterday</button><label class="chip date-chip${custom ? ' on' : ''}" for="qa-date-in">${ic('calendar', 16, 2)}<span>${custom ? esc(U.fmtDay(st.date)) : 'Other date'}</span><input type="date" id="qa-date-in" value="${st.date}" max="${t}" aria-label="Pick a date"></label>`;
    };
    const keypadHtml = () =>
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'del']
        .map((k) => `<button type="button" class="key${k === 'del' ? ' key-del' : ''}" data-act="qa-key" data-k="${k}" aria-label="${k === 'del' ? 'Delete (hold to clear)' : k === '.' ? 'Decimal point' : k}">${k === 'del' ? ic('backspace', 24, 1.9) : k}</button>`)
        .join('');

    const render = () => {
      let h = `<div class="qa"><div class="qa-head"><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Close">${ic('close', 22, 2)}</button><h2 class="qa-title">${isEdit ? 'Edit transaction' : 'New transaction'}</h2>${isEdit ? `<button type="button" class="icon-btn danger" data-act="qa-delete" aria-label="Delete this transaction">${ic('trash', 20, 1.9)}</button>` : '<span class="icon-spacer"></span>'}</div>`;
      h += `<div class="qa-scroll">`;
      h += UI.seg('qa-type', [{ id: 'expense', label: 'Expense' }, { id: 'income', label: 'Income' }], st.type, 'qa-type');
      h += `<button type="button" class="qa-amount" data-act="qa-keypad" aria-label="Amount"><span class="qa-amt" aria-live="polite"></span></button>`;
      h += `<label class="field qa-name" for="qa-name">${ic('edit', 18, 1.9)}<span class="sr">Description</span><input id="qa-name" autocomplete="off" enterkeyhint="done" placeholder="What for? Try “coffee 3.40 yesterday”" value="${esc(st.name)}"></label>`;
      h += `<div class="qa-suggest" id="qa-suggest"></div>`;
      h += `<div class="qa-label">Category</div><div class="chips scroll-x qa-cats" id="qa-cats" role="group" aria-label="Category">${catsHtml()}</div>`;
      h += `<div class="chips qa-dates" id="qa-dates" role="group" aria-label="Date">${datesHtml()}</div>`;
      h += `<label class="field" for="qa-note">${ic('note', 18, 1.9)}<span class="sr">Note</span><input id="qa-note" autocomplete="off" enterkeyhint="done" placeholder="Note (optional)" value="${esc(st.note)}"></label>`;
      if (!isEdit) h += `<div class="set-row qa-repeat"><span id="qa-rep-lbl" class="set-text"><b>Repeat monthly</b><span>Logs it automatically each month</span></span>${UI.switch('qa-rep', st.repeat, 'qa-repeat', 'qa-rep-lbl')}</div>`;
      else if (st.recurringId) h += `<p class="hint">${ic('repeat', 16, 1.9)} Part of a recurring payment. Changes here only affect this entry.</p>`;
      h += `</div><div class="qa-bottom"><div class="keypad" id="qa-keypad">${keypadHtml()}</div><button type="button" class="btn btn-primary btn-lg qa-save press" data-act="qa-save"></button></div></div>`;
      return h;
    };

    const $ = (s) => sheet.querySelector(s);
    const updAmount = (bump) => {
      const pence = U.keypadPence(st.amt);
      const el = $('.qa-amt');
      el.textContent = (st.type === 'income' && pence ? '+' : '') + U.keypadDisplay(st.amt);
      el.classList.toggle('zero', !pence);
      el.classList.toggle('in', st.type === 'income' && !!pence);
      if (bump && !U.reducedMotion()) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      }
      const btn = $('.qa-save');
      btn.textContent = pence ? (isEdit ? 'Save changes · ' : 'Save ' + st.type + ' · ') + U.fmt(pence) : 'Enter an amount';
      btn.classList.toggle('btn-disabled', !pence);
    };
    const updCats = (auto) => {
      const box = $('#qa-cats');
      box.innerHTML = catsHtml();
      const on = box.querySelector('.on');
      if (on) {
        if (auto && !U.reducedMotion()) on.classList.add('pulse');
        const bl = box.getBoundingClientRect();
        const r = on.getBoundingClientRect();
        if (r.left < bl.left || r.right > bl.right) box.scrollTo({ left: box.scrollLeft + r.left - bl.left - 20, behavior: U.reducedMotion() ? 'auto' : 'smooth' });
      }
    };
    const updDates = () => {
      $('#qa-dates').innerHTML = datesHtml();
      bindDate();
    };
    const bindDate = () => {
      const d = $('#qa-date-in');
      d.addEventListener('click', () => {
        try {
          if (d.showPicker) d.showPicker();
        } catch (e) {}
      });
      d.addEventListener('change', () => {
        if (/^\d{4}-\d{2}-\d{2}$/.test(d.value)) {
          st.date = d.value;
          updDates();
        }
      });
    };
    const updSuggest = () => {
      const box = $('#qa-suggest');
      const p = X.parse(st.name, st.type);
      st.parsed = p && (p.amount || (p.date && p.date !== st.date)) ? p : null;
      st.nameSugs = X.nameSuggestions(st.name, st.type, 3);
      let h = '';
      if (st.parsed) {
        const parts = [];
        if (p.amount) parts.push((p.type === 'income' ? '+' : '') + U.fmt(p.amount));
        if (p.date) parts.push(U.fmtDay(p.date));
        if (p.name) parts.push(p.name);
        if (p.categoryId) parts.push(S.cat(p.categoryId).name);
        h += `<button type="button" class="fill-chip press" data-act="qa-apply">${ic('spark', 16, 2)}<span>Fill in: ${esc(parts.join(' · '))}</span></button>`;
      }
      if (st.nameSugs.length) {
        h += `<div class="chips scroll-x">` + st.nameSugs.map((s, i) => `<button type="button" class="chip press" data-act="qa-name-pick" data-i="${i}">${UI.tile(S.cat(s.categoryId), 'sm')}${esc(s.name)} · ${U.fmt(s.amount)}</button>`).join('') + `</div>`;
      }
      box.innerHTML = h;
    };
    const autoCat = () => {
      if (st.catTouched) return;
      const p = X.parse(st.name, st.type);
      const c = X.suggestCategory(p && p.name ? p.name : st.name, st.type);
      if (c && c !== st.categoryId) {
        st.categoryId = c;
        updCats(true);
      }
    };
    const setType = (t, keepCat) => {
      if (t === st.type) return;
      st.type = t;
      const seg = sheet.querySelector('[data-seg="qa-type"]');
      if (seg) UI.setSeg(seg, t === 'expense' ? 0 : 1);
      if (!keepCat || S.cat(st.categoryId).type !== t) {
        st.categoryId = X.suggestCategory(st.name, t) || defaultCat(t);
        st.catTouched = false;
      }
      updCats();
      updAmount();
      updSuggest();
    };
    const applyParse = () => {
      const p = st.parsed;
      if (!p) return;
      if (p.type && p.type !== st.type) setType(p.type, true);
      if (p.amount) st.amt = trimAmt(p.amount);
      if (p.date) st.date = p.date;
      if (p.name) st.name = p.name;
      if (p.categoryId && S.cat(p.categoryId).type === st.type) st.categoryId = p.categoryId;
      $('#qa-name').value = st.name;
      updAmount(true);
      updCats(true);
      updDates();
      updSuggest();
      U.vibrate(8);
    };

    const save = async () => {
      if (st.saving) return;
      const amount = U.keypadPence(st.amt);
      if (!amount) {
        const a = $('.qa-amount');
        a.classList.remove('shake');
        void a.offsetWidth;
        a.classList.add('shake');
        sheet.classList.remove('typing');
        U.vibrate(20);
        return;
      }
      st.saving = true;
      $('.qa-save').disabled = true;
      try {
        let rule = null;
        if (!isEdit && st.repeat) {
          rule = await S.saveRecurring({
            type: st.type,
            amount: amount,
            categoryId: st.categoryId,
            name: st.name.trim() || S.cat(st.categoryId).name,
            note: st.note,
            freq: 'monthly',
            anchor: Number(st.date.slice(8)),
            nextDate: U.addMonths(st.date, 1, Number(st.date.slice(8)))
          });
        }
        const before = existing ? Object.assign({}, existing) : null;
        const t = await S.saveTx({ id: st.id, type: st.type, amount: amount, categoryId: st.categoryId, name: st.name, note: st.note, date: st.date, recurringId: rule ? rule.id : st.recurringId });
        U.vibrate(12);
        await UI.closeSheet();
        const label = (t.type === 'income' ? '+' : '−') + U.fmt(t.amount) + ' · ' + S.cat(t.categoryId).name;
        UI.toast(isEdit ? 'Changes saved' : 'Saved ' + label + (rule ? ' · repeats monthly' : ''), {
          action: 'Undo',
          onAction: async () => {
            try {
              if (isEdit) await S.restoreTx(before);
              else {
                await S.deleteTx(t.id);
                if (rule) await S.deleteRecurring(rule.id);
              }
              UI.toast(isEdit ? 'Change undone' : 'Entry removed');
            } catch (e) {
              UI.error(e);
            }
          }
        });
      } catch (e) {
        st.saving = false;
        $('.qa-save').disabled = false;
        UI.error(e);
      }
    };

    M.cur = {
      key: (k) => {
        let a = st.amt;
        if (k === 'del') a = a.length > 1 ? a.slice(0, -1) : '0';
        else if (k === '.') {
          if (a.indexOf('.') < 0) a += '.';
        } else {
          const dec = a.split('.')[1];
          if (dec !== undefined && dec.length >= 2) return;
          if (a.replace('.', '').length >= 8) return;
          a = a === '0' ? k : a + k;
        }
        st.amt = a;
        updAmount(true);
      },
      clear: () => {
        st.amt = '0';
        updAmount(true);
      },
      type: (t) => setType(t),
      cat: (id) => {
        st.categoryId = id;
        st.catTouched = true;
        sheet.querySelectorAll('.cat-chip').forEach((b) => {
          const on = b.getAttribute('data-id') === id;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
      },
      date: (d) => {
        st.date = d;
        updDates();
      },
      repeat: (el) => {
        st.repeat = !st.repeat;
        el.setAttribute('aria-checked', String(st.repeat));
      },
      apply: applyParse,
      namePick: (i) => {
        const s = st.nameSugs[i];
        if (!s) return;
        st.name = s.name;
        $('#qa-name').value = s.name;
        st.categoryId = s.categoryId;
        st.catTouched = true;
        if (!U.keypadPence(st.amt)) st.amt = trimAmt(s.amount);
        updAmount(true);
        updCats(true);
        updSuggest();
      },
      keypad: () => {
        const f = document.activeElement;
        if (f && f.blur && sheet.contains(f)) f.blur();
        sheet.classList.remove('typing');
      },
      save: save,
      del: async () => {
        try {
          const t = await S.deleteTx(st.id);
          await UI.closeSheet();
          UI.toast('Deleted ' + (t.name || S.cat(t.categoryId).name), {
            action: 'Undo',
            onAction: async () => {
              await S.restoreTx(t);
              UI.toast('Entry restored');
            }
          });
        } catch (e) {
          UI.error(e);
        }
      }
    };

    UI.openSheet({
      label: isEdit ? 'Edit transaction' : 'New transaction',
      full: true,
      cls: 'qa-sheet',
      render: render,
      after: (el) => {
        sheet = el;
        updAmount();
        updSuggest();
        bindDate();
        const nameIn = $('#qa-name');
        const noteIn = $('#qa-note');
        nameIn.addEventListener('input', () => {
          st.name = nameIn.value;
          autoCat();
          updSuggest();
        });
        nameIn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (st.parsed) applyParse();
            nameIn.blur();
          }
        });
        noteIn.addEventListener('input', () => (st.note = noteIn.value));
        noteIn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            noteIn.blur();
          }
        });
        [nameIn, noteIn].forEach((i) => {
          i.addEventListener('focus', () => sheet.classList.add('typing'));
          i.addEventListener('blur', () =>
            setTimeout(() => {
              if (!sheet.contains(document.activeElement) || !/INPUT/.test(document.activeElement.tagName) || document.activeElement.type === 'date') sheet.classList.remove('typing');
            }, 80)
          );
        });
        /* hold delete to clear */
        const del = sheet.querySelector('.key-del');
        let holdTimer = null;
        del.addEventListener('pointerdown', () => {
          holdTimer = setTimeout(() => {
            holdTimer = 'fired';
            M.cur.clear();
            U.vibrate(15);
          }, 450);
        });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) =>
          del.addEventListener(ev, () => {
            if (holdTimer && holdTimer !== 'fired') clearTimeout(holdTimer);
            setTimeout(() => (holdTimer = null), 0);
          })
        );
        del.addEventListener(
          'click',
          (e) => {
            if (holdTimer === 'fired') {
              e.stopPropagation();
              e.preventDefault();
            }
          },
          true
        );
        /* physical keyboard support */
        sheet.addEventListener('keydown', (e) => {
          if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
          if (/^[0-9]$/.test(e.key)) M.cur.key(e.key);
          else if (e.key === '.' || e.key === ',') M.cur.key('.');
          else if (e.key === 'Backspace') M.cur.key('del');
          else if (e.key === 'Enter') save();
          else if (e.key === 'Escape') UI.closeSheet();
          else return;
          e.preventDefault();
        });
      },
      onClose: () => {
        M.cur = null;
      }
    });
  };
  A['qa-key'] = (el) => M.cur && M.cur.key(el.getAttribute('data-k'));
  A['qa-type'] = (el) => M.cur && M.cur.type(el.getAttribute('data-val'));
  A['qa-cat'] = (el) => M.cur && M.cur.cat(el.getAttribute('data-id'));
  A['qa-date'] = (el) => M.cur && M.cur.date(el.getAttribute('data-val'));
  A['qa-repeat'] = (el) => M.cur && M.cur.repeat(el);
  A['qa-apply'] = () => M.cur && M.cur.apply();
  A['qa-name-pick'] = (el) => M.cur && M.cur.namePick(Number(el.getAttribute('data-i')));
  A['qa-keypad'] = () => M.cur && M.cur.keypad();
  A['qa-save'] = () => M.cur && M.cur.save();
  A['qa-delete'] = () => M.cur && M.cur.del();

  /* ================= RECURRING ================= */
  M.recurringForm = (existing) => {
    const isEdit = !!existing;
    const r = existing
      ? Object.assign({}, existing, { amountStr: U.penceToInput(existing.amount) })
      : { type: 'expense', amountStr: '', name: '', categoryId: 'bills', freq: 'monthly', nextDate: U.addDays(U.today(), 1), paused: false, note: '' };
    let sheet = null;
    const catsHtml = () =>
      S.catsByUse(r.type)
        .map((c) => `<button type="button" class="chip cat-chip press${c.id === r.categoryId ? ' on' : ''}" data-act="rec-cat" data-id="${esc(c.id)}" aria-pressed="${c.id === r.categoryId}">${UI.tile(c, 'sm')}${esc(c.name)}</button>`)
        .join('');
    const summary = () => {
      const p = U.parseMoney(r.amountStr);
      if (!p || !/^\d{4}-\d{2}-\d{2}$/.test(r.nextDate)) return 'Fill in the amount and the next date.';
      const day = Number(r.nextDate.slice(8));
      const when = r.freq === 'weekly' ? 'every ' + U.dowLong(r.nextDate) : r.freq === 'yearly' ? 'every year on ' + U.fmtShortDate(r.nextDate) : 'on the ' + U.ordinal(day) + ' of every month' + (day > 28 ? ' (or the last day, in shorter months)' : '');
      return (r.paused ? 'Paused. When resumed it logs ' : 'Logs ') + (r.type === 'income' ? '+' : '−') + U.fmt(p) + ' ' + when + ', starting ' + U.fmtDay(r.nextDate) + '.';
    };
    const render = () => {
      let h = `<div class="form"><div class="qa-head"><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Close">${ic('close', 22, 2)}</button><h2 class="qa-title">${isEdit ? 'Edit recurring' : 'New recurring'}</h2>${isEdit ? `<button type="button" class="icon-btn danger" data-act="rec-delete" aria-label="Delete">${ic('trash', 20, 1.9)}</button>` : '<span class="icon-spacer"></span>'}</div>`;
      h += UI.seg('rec-type', [{ id: 'expense', label: 'Expense' }, { id: 'income', label: 'Income' }], r.type, 'rec-type');
      h += `<label class="field-block" for="rec-name"><span class="lbl">Name</span><input class="input" id="rec-name" autocomplete="off" placeholder="e.g. Netflix" value="${esc(r.name)}"></label>`;
      h += `<label class="field-block" for="rec-amt"><span class="lbl">Amount</span><span class="money-input"><span>£</span><input id="rec-amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(r.amountStr)}"></span></label>`;
      h += `<div class="field-block"><span class="lbl">Category</span><div class="chips scroll-x" id="rec-cats" role="group" aria-label="Category">${catsHtml()}</div></div>`;
      h += `<div class="field-block"><span class="lbl">How often</span>${UI.seg('rec-freq', [{ id: 'weekly', label: 'Weekly' }, { id: 'monthly', label: 'Monthly' }, { id: 'yearly', label: 'Yearly' }], r.freq, 'rec-freq')}</div>`;
      h += `<label class="field-block" for="rec-date"><span class="lbl">${isEdit ? 'Next due' : 'First payment'}</span><input class="input" type="date" id="rec-date" value="${r.nextDate}"></label>`;
      h += `<label class="field" for="rec-note">${ic('note', 18, 1.9)}<span class="sr">Note</span><input id="rec-note" autocomplete="off" placeholder="Note (optional)" value="${esc(r.note || '')}"></label>`;
      if (isEdit) h += `<div class="set-row"><span id="rec-p-lbl" class="set-text"><b>Paused</b><span>Nothing is logged while paused</span></span>${UI.switch('rec-p', r.paused, 'rec-pause', 'rec-p-lbl')}</div>`;
      h += `<p class="note-box" id="rec-sum" aria-live="polite">${esc(summary())}</p>`;
      h += `<button type="button" class="btn btn-primary btn-lg press" data-act="rec-save">${isEdit ? 'Save changes' : 'Add recurring'}</button></div>`;
      return h;
    };
    const upd = () => (sheet.querySelector('#rec-sum').textContent = summary());
    M.rec = {
      type: (t) => {
        r.type = t;
        UI.setSeg(sheet.querySelector('[data-seg="rec-type"]'), t === 'expense' ? 0 : 1);
        if (S.cat(r.categoryId).type !== t) r.categoryId = (S.catsByUse(t)[0] || {}).id;
        sheet.querySelector('#rec-cats').innerHTML = catsHtml();
        upd();
      },
      cat: (id) => {
        r.categoryId = id;
        sheet.querySelector('#rec-cats').innerHTML = catsHtml();
      },
      freq: (f, el) => {
        r.freq = f;
        UI.setSeg(el.closest('[data-seg]'), Number(el.getAttribute('data-seg-i')));
        upd();
      },
      pause: (el) => {
        r.paused = !r.paused;
        el.setAttribute('aria-checked', String(r.paused));
        upd();
      },
      save: async (btn) => {
        btn.disabled = true;
        try {
          const amount = U.parseMoney(r.amountStr);
          if (amount == null) throw new Error('Enter the amount, like 9.99.');
          const changedDate = !isEdit || r.nextDate !== existing.nextDate;
          await S.saveRecurring({ id: r.id, type: r.type, amount: amount, name: r.name, categoryId: r.categoryId, freq: r.freq, nextDate: r.nextDate, paused: r.paused, note: r.note, anchor: changedDate ? null : r.anchor });
          U.vibrate(10);
          await UI.closeSheet();
          UI.toast(isEdit ? 'Recurring updated' : 'Recurring added');
        } catch (e) {
          btn.disabled = false;
          UI.error(e);
        }
      },
      del: async () => {
        const ok = await UI.confirm({ title: 'Delete ' + r.name + '?', body: 'Entries it has already logged stay in your history. Nothing new will be logged.', ok: 'Delete', danger: true });
        if (!ok) return;
        try {
          const gone = await S.deleteRecurring(r.id);
          await UI.closeSheet();
          UI.toast('Deleted ' + gone.name, {
            action: 'Undo',
            onAction: async () => {
              await S.restoreRecurring(gone);
              UI.toast('Recurring restored');
            }
          });
        } catch (e) {
          UI.error(e);
        }
      }
    };
    UI.openSheet({
      label: isEdit ? 'Edit recurring' : 'New recurring',
      cls: 'tall',
      render: render,
      after: (el) => {
        sheet = el;
        const bind = (id, key) => {
          const i = el.querySelector(id);
          i.addEventListener('input', () => {
            r[key] = i.value;
            upd();
          });
          i.addEventListener('change', () => {
            r[key] = i.value;
            upd();
          });
        };
        bind('#rec-name', 'name');
        bind('#rec-amt', 'amountStr');
        bind('#rec-date', 'nextDate');
        bind('#rec-note', 'note');
      },
      onClose: () => (M.rec = null)
    });
  };
  A['rec-type'] = (el) => M.rec && M.rec.type(el.getAttribute('data-val'));
  A['rec-cat'] = (el) => M.rec && M.rec.cat(el.getAttribute('data-id'));
  A['rec-freq'] = (el) => M.rec && M.rec.freq(el.getAttribute('data-val'), el);
  A['rec-pause'] = (el) => M.rec && M.rec.pause(el);
  A['rec-save'] = (el) => M.rec && M.rec.save(el);
  A['rec-delete'] = () => M.rec && M.rec.del();

  /* ================= CATEGORY EDITOR ================= */
  M.categoryForm = (existing, type) => {
    const isEdit = !!existing;
    const c = existing ? Object.assign({}, existing) : { name: '', type: type, icon: 'box', color: 'blue' };
    let sheet = null;
    const preview = () => `${UI.tile(c, 'lg')}`;
    const render = () => {
      let h = `<div class="form"><div class="qa-head"><button type="button" class="icon-btn" data-act="sheet-close" aria-label="Close">${ic('close', 22, 2)}</button><h2 class="qa-title">${isEdit ? 'Edit category' : 'New ' + c.type + ' category'}</h2><span class="icon-spacer"></span></div>`;
      h += `<div class="cat-name-row"><span id="cf-prev">${preview()}</span><label class="field-block grow" for="cf-name"><span class="lbl">Name</span><input class="input" id="cf-name" autocomplete="off" placeholder="e.g. Coffee" value="${esc(c.name)}" ${isEdit ? '' : 'autofocus'}></label></div>`;
      h += `<div class="field-block"><span class="lbl">Colour</span><div class="swatches" role="group" aria-label="Colour">${U.COLORS.map((k) => `<button type="button" class="swatch c-${k}${c.color === k ? ' on' : ''}" data-act="cf-color" data-val="${k}" aria-label="${U.COLOR_NAMES[k]}" aria-pressed="${c.color === k}"><span></span></button>`).join('')}</div></div>`;
      h += `<div class="field-block"><span class="lbl">Icon</span><div class="icon-grid" role="group" aria-label="Icon">${U.PICKABLE_ICONS.map((k) => `<button type="button" class="icon-opt${c.icon === k ? ' on' : ''}" data-act="cf-icon" data-val="${k}" aria-label="${k}" aria-pressed="${c.icon === k}">${ic(k, 20)}</button>`).join('')}</div></div>`;
      h += `<button type="button" class="btn btn-primary btn-lg press" data-act="cf-save">${isEdit ? 'Save changes' : 'Add category'}</button>`;
      if (isEdit && !c.builtIn) h += `<button type="button" class="btn btn-ghost-danger press" data-act="cf-remove">Remove category</button>`;
      return h + `</div>`;
    };
    const setOn = (sel, val) =>
      sheet.querySelectorAll(sel).forEach((b) => {
        const on = b.getAttribute('data-val') === val;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
    M.cf = {
      color: (k) => {
        c.color = k;
        setOn('.swatch', k);
        sheet.querySelector('#cf-prev').innerHTML = preview();
      },
      icon: (k) => {
        c.icon = k;
        setOn('.icon-opt', k);
        sheet.querySelector('#cf-prev').innerHTML = preview();
      },
      save: async (btn) => {
        btn.disabled = true;
        try {
          c.name = sheet.querySelector('#cf-name').value;
          const out = await S.saveCategory(c);
          await UI.closeSheet();
          UI.toast((isEdit ? 'Saved ' : 'Added ') + out.name);
        } catch (e) {
          btn.disabled = false;
          UI.error(e);
        }
      },
      remove: async () => {
        await UI.closeSheet();
        const btn = document.createElement('button');
        btn.setAttribute('data-id', c.id);
        A['cat-remove'](btn);
      }
    };
    UI.openSheet({
      label: isEdit ? 'Edit category' : 'New category',
      cls: 'tall',
      render: render,
      after: (el) => {
        sheet = el;
      },
      onClose: () => (M.cf = null)
    });
  };
  A['cf-color'] = (el) => M.cf && M.cf.color(el.getAttribute('data-val'));
  A['cf-icon'] = (el) => M.cf && M.cf.icon(el.getAttribute('data-val'));
  A['cf-save'] = (el) => M.cf && M.cf.save(el);
  A['cf-remove'] = () => M.cf && M.cf.remove();

  /* ================= FIRST RUN ================= */
  M.onboarding = () => {
    UI.openSheet({
      label: 'Welcome',
      cls: 'welcome-sheet',
      render: () =>
        `<div class="form"><span class="tile tile-xl c-blue">${ic('wallet', 30, 1.8)}</span><h2 class="sheet-title">Welcome to Money Tracker</h2><p class="sheet-text">Everything you log stays on this phone. To start, enter what’s in your account right now. You can bring in your Money Lover history later.</p><label class="field-block" for="ob-bal"><span class="lbl">Current balance</span><span class="money-input"><span>£</span><input id="ob-bal" inputmode="decimal" autocomplete="off" placeholder="0.00"></span></label><label class="field-inline" for="ob-neg"><input type="checkbox" id="ob-neg"> My account is overdrawn (minus)</label><button type="button" class="btn btn-primary btn-lg press" data-act="ob-start">Start tracking</button><label class="btn btn-soft press" for="ml-file">${ic('upload', 18, 2)} Import from Money Lover<input type="file" id="ml-file" accept=".csv,text/csv,text/comma-separated-values" class="sr"></label><button type="button" class="btn btn-text press" data-act="ob-skip">Skip for now</button><button type="button" class="btn btn-text press" data-act="load-examples">${ic('spark', 16, 2)} Explore with example data first</button></div>`,
      after: (el) => UI.bindImport(el),
      onClose: () => {
        if (!S.meta.onboarded) S.setMeta('onboarded', true).catch(() => {});
      }
    });
  };
  A['ob-start'] = async (el) => {
    const inp = document.getElementById('ob-bal');
    const p = U.parseMoney(inp.value || '0');
    if (p == null) return UI.toast('Enter an amount like 1250.00', { kind: 'error' });
    el.disabled = true;
    try {
      if (p > 0) {
        const neg = document.getElementById('ob-neg').checked;
        await S.saveTx({ type: neg ? 'expense' : 'income', amount: p, categoryId: 'adjust', name: 'Opening balance', note: '', date: U.today() });
      }
      await S.setMeta('onboarded', true);
      MT.db.persist();
      await UI.closeSheet();
      UI.toast('All set. Tap + to log your first expense');
    } catch (e) {
      el.disabled = false;
      UI.error(e);
    }
  };
  A['ob-skip'] = async () => {
    await S.setMeta('onboarded', true).catch(() => {});
    MT.db.persist();
    UI.closeSheet();
  };

  /* ================= MONEY LOVER IMPORT ================= */
  M.importPreview = (res, fileName) => {
    const s = res.summary;
    const mine = S.tx.filter((t) => !t.example).length;
    const addBal = S.balance() + s.balance;
    let mode = 'replace';
    const opt = (val, title, body) =>
      `<button type="button" class="choice-opt press${mode === val ? ' on' : ''}" role="radio" aria-checked="${mode === val}" data-act="imp-mode" data-val="${val}"><span class="radio" aria-hidden="true"></span><span class="choice-text"><b>${title}</b><span>${body}</span></span></button>`;
    const render = () =>
      `<div class="form"><h2 class="sheet-title">Import from Money Lover</h2><p class="sheet-text">${esc(fileName)}</p>` +
      `<div class="kv"><span>Transactions</span><b>${s.count.toLocaleString('en-GB')}</b><span>Covering</span><b>${U.fmtShortDate(s.from)} ${s.from.slice(0, 4)} – ${U.fmtShortDate(s.to)} ${s.to.slice(0, 4)}</b><span>Balance in the file</span><b>${U.fmt(s.balance)}</b>${s.excluded ? `<span>Kept out of reports</span><b>${s.excluded}</b>` : ''}${res.newCats.length ? `<span>New ${res.newCats.length === 1 ? 'category' : 'categories'}</span><b>${esc(res.newCats.map((c) => c.name).join(', '))}</b>` : ''}</div>` +
      (s.skipped ? `<p class="note-box warn">${s.skipped} row${s.skipped === 1 ? '' : 's'} couldn’t be read and will be skipped.</p>` : '') +
      (s.otherCurrency ? `<p class="note-box warn">${s.otherCurrency} entr${s.otherCurrency === 1 ? 'y is' : 'ies are'} not in GBP. They’ll be imported as pounds.</p>` : '') +
      `<div class="choice" role="radiogroup" aria-label="How to import">` +
      opt('replace', 'Replace what’s in the app', mine ? `Recommended. Your Money Lover history already includes your starting balance. Your ${mine} current entr${mine === 1 ? 'y is' : 'ies are'} saved as a snapshot first.` : 'Recommended. Your Money Lover history already includes your starting balance.') +
      opt('add', 'Add to what’s here', `Keeps your current entries. Your balance would become ${U.fmt(addBal)}.`) +
      `</div><button type="button" class="btn btn-primary btn-lg press" data-act="imp-go">Import ${s.count.toLocaleString('en-GB')} transactions</button></div>`;
    let entry = null;
    M.imp = {
      mode: (v) => {
        mode = v;
        UI.rerenderSheet(entry);
      },
      go: async (btn) => {
        btn.disabled = true;
        btn.textContent = 'Importing…';
        try {
          const n = await MT.importer.apply(res, mode);
          await UI.closeSheet();
          if (UI.route.name !== 'home') UI.go('home', {}, 'replace');
          UI.toast('Imported ' + n.toLocaleString('en-GB') + ' transactions · balance ' + U.fmt(S.balance()), { duration: 4500 });
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Try again';
          UI.error(e);
        }
      }
    };
    entry = UI.openSheet({ label: 'Import from Money Lover', cls: 'tall', render: render, onClose: () => (M.imp = null) });
  };
  A['imp-mode'] = (el) => M.imp && M.imp.mode(el.getAttribute('data-val'));
  A['imp-go'] = (el) => M.imp && M.imp.go(el);

  /* ================= RESTORE PREVIEW ================= */
  M.restorePreview = (v, source) => {
    const s = v.summary;
    UI.openSheet({
      label: 'Restore preview',
      render: () =>
        `<div class="form"><h2 class="sheet-title">Restore this backup?</h2><p class="sheet-text">${esc(source)}</p><div class="kv"><span>Transactions</span><b>${s.tx}</b><span>Covering</span><b>${s.from ? U.fmtShortDate(s.from) + ' ' + s.from.slice(0, 4) + ' – ' + U.fmtShortDate(s.to) + ' ' + s.to.slice(0, 4) : '—'}</b><span>Balance</span><b>${U.fmt(s.balance)}</b><span>Categories</span><b>${s.cats}</b><span>Recurring</span><b>${s.rec}</b></div>${s.skipped ? `<p class="note-box warn">${s.skipped} damaged entr${s.skipped === 1 ? 'y' : 'ies'} will be skipped.</p>` : ''}<p class="note-box">This replaces what’s in the app now (${S.tx.length} transactions, balance ${U.fmt(S.balance())}). A snapshot of your current data is saved first, so you can switch back from Backup.</p><div class="btn-row"><button type="button" class="btn" data-act="sheet-close">Cancel</button><button type="button" class="btn btn-danger" data-act="restore-go">Replace data</button></div></div>`
    });
    UI._restore = v;
  };
  A['restore-go'] = async (el) => {
    const v = UI._restore;
    if (!v) return;
    el.disabled = true;
    try {
      await S.replaceAll(v.data);
      UI._restore = null;
      UI.applyTheme(S.settings().theme);
      await UI.closeSheet();
      UI.toast('Restored ' + v.summary.tx + ' transactions');
    } catch (e) {
      el.disabled = false;
      UI.error(e);
    }
  };
})();

/* Money Tracker — Money Lover CSV import. Runs entirely on the phone; the file never leaves it. */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const S = MT.store;
  const I = (MT.importer = {});

  /* RFC 4180 CSV: quoted fields, escaped quotes, commas and newlines inside quotes, CRLF */
  I.parseCSV = (text) => {
    const rows = [];
    let row = [];
    let f = '';
    let q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            f += '"';
            i++;
          } else q = false;
        } else f += c;
      } else if (c === '"') q = true;
      else if (c === ',') {
        row.push(f);
        f = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f);
        rows.push(row);
        row = [];
        f = '';
      } else f += c;
    }
    if (f !== '' || row.length) {
      row.push(f);
      rows.push(row);
    }
    return rows;
  };

  const ICON_GUESS = { loan: 'percent', debt: 'percent', mortgage: 'house', rent: 'house', education: 'book', kids: 'family', children: 'family', car: 'car', coffee: 'coffee', groceries: 'cart', phone: 'phoneCat', games: 'game' };
  const guessIcon = (name) => {
    const n = name.toLowerCase();
    const k = Object.keys(ICON_GUESS).find((w) => n.indexOf(w) >= 0);
    return k ? ICON_GUESS[k] : 'box';
  };

  I.fromMoneyLover = (text) => {
    const rows = I.parseCSV(String(text || '').replace(/^﻿/, ''));
    if (rows.length < 2) return { ok: false, error: 'That file has no transactions in it.' };
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const col = (n) => head.indexOf(n);
    const iId = col('id');
    const iNote = col('note');
    const iAmt = col('amount');
    const iCat = col('category');
    const iDate = col('date');
    const iCur = col('currency');
    const iEx = col('exclude report');
    if (iAmt < 0 || iCat < 0 || iDate < 0) return { ok: false, error: 'This doesn’t look like a Money Lover export. It needs Amount, Category and Date columns.' };

    const byName = {};
    S.cats.forEach((c) => {
      if (!c.system) byName[c.type + '|' + c.name.toLowerCase()] = c;
    });
    const newCats = {};
    const tx = [];
    let skipped = 0;
    let excluded = 0;
    let otherCurrency = 0;
    const now = Date.now();
    rows.slice(1).forEach((r, n) => {
      if (r.length === 1 && !r[0].trim()) return;
      const raw = String(r[iAmt] || '').trim();
      const neg = raw.charAt(0) === '-';
      const pence = U.parseMoney(raw.replace(/^[-+]/, ''));
      const dm = String(r[iDate] || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!pence || !dm || Number(dm[2]) > 12 || Number(dm[1]) > 31) {
        skipped++;
        return;
      }
      const date = dm[3] + '-' + dm[2].padStart(2, '0') + '-' + dm[1].padStart(2, '0');
      const type = neg ? 'expense' : 'income';
      const cname = String(r[iCat] || '').trim() || (neg ? 'Other Expense' : 'Other Income');
      const key = type + '|' + cname.toLowerCase();
      let cat = byName[key] || newCats[key];
      if (!cat) {
        cat = newCats[key] = { id: 'ml_' + type + '_' + cname.toLowerCase().replace(/[^a-z0-9]+/g, '-'), name: cname.slice(0, 40), type: type, icon: guessIcon(cname), color: 'slate', builtIn: false };
      }
      if (iCur >= 0 && r[iCur] && r[iCur].trim() && r[iCur].trim().toUpperCase() !== 'GBP') otherCurrency++;
      const ex = iEx >= 0 && /^true$/i.test(String(r[iEx] || '').trim());
      if (ex) excluded++;
      const text = String(iNote >= 0 ? r[iNote] || '' : '').trim();
      const id = 'ml_' + (iId >= 0 && String(r[iId] || '').trim() ? String(r[iId]).trim() : 'row' + n);
      const t = { id: id, type: type, amount: pence, categoryId: cat.id, name: text.slice(0, 80), note: text.length > 80 ? text : '', date: date, recurringId: null, source: 'moneylover', createdAt: now - n, updatedAt: now };
      if (ex) t.excluded = true;
      tx.push(t);
    });
    if (!tx.length) return { ok: false, error: 'No transactions could be read from that file.' };
    const dates = tx.map((t) => t.date).sort();
    return {
      ok: true,
      tx: tx,
      newCats: Object.values(newCats),
      summary: {
        count: tx.length,
        from: dates[0],
        to: dates[dates.length - 1],
        balance: tx.reduce((a, t) => a + (t.type === 'income' ? t.amount : -t.amount), 0),
        skipped: skipped,
        excluded: excluded,
        otherCurrency: otherCurrency
      }
    };
  };

  /* mode 'replace': the import becomes your full history (a snapshot of the current data is kept first)
     mode 'add': imported entries are added; anything already imported before is skipped */
  I.apply = async (res, mode) => {
    if (mode === 'replace') {
      await S.replaceAll({ tx: res.tx, categories: S.cats.concat(res.newCats.filter((c) => !S.cats.find((x) => x.id === c.id))), recurring: S.rec.slice(), settings: null });
      return res.tx.length;
    }
    const have = new Set(S.tx.map((t) => t.id));
    const fresh = res.tx.filter((t) => !have.has(t.id));
    await S.addBatch(res.newCats.filter((c) => !S.cats.find((x) => x.id === c.id)), fresh);
    return fresh.length;
  };
})();

/* Money Tracker — start-up, example data, background upkeep */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const S = MT.store;
  const UI = MT.ui;
  const A = UI.actions;
  MT.VERSION = '1.1.0';

  /* ---------- Example data: flagged so it can be removed in one tap ---------- */
  MT.examples = () => {
    const today = U.today();
    let seed = 20261021;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    const tx = [];
    const now = Date.now();
    const add = (date, type, cat, name, amount, note) => {
      if (date > today) return;
      tx.push({ id: 'ex_' + tx.length, type: type, amount: amount, categoryId: cat, name: name, note: note || '', date: date, recurringId: null, example: true, createdAt: now - tx.length, updatedAt: now });
    };
    const first = U.addMonths(U.monthStart(today), -3, 1);
    add(first, 'income', 'adjust', 'Opening balance', 185000);
    for (let k = 0; k < 4; k++) {
      const ms = U.addMonths(first, k, 1);
      const dim = Number(U.monthEnd(ms).slice(8));
      const day = (d) => ms.slice(0, 8) + String(Math.min(d, dim)).padStart(2, '0');
      add(day(1), 'income', 'salary', 'Salary', 215000);
      add(day(1), 'expense', 'home', 'Rent', 82500);
      add(day(3), 'expense', 'health', 'Gym membership', 3000);
      add(day(5), 'expense', 'bills', 'Electricity', 6400 + Math.round(rnd() * 900));
      add(day(12), 'expense', 'bills', 'Mobile phone', 1500);
      add(day(21), 'expense', 'bills', 'Broadband', k === 3 ? 3899 : 3599);
      for (let w = 0; w < 5; w++) add(day(2 + w * 7), 'expense', 'food', 'Supermarket shop', 3200 + Math.round(rnd() * 2800));
      for (let c = 0; c < 6; c++) add(day(1 + Math.floor(rnd() * dim)), 'expense', 'food', 'Coffee', [320, 340, 360][Math.floor(rnd() * 3)]);
      add(day(9), 'expense', 'transport', 'Fuel', 4500 + Math.round(rnd() * 1000));
      add(day(24), 'expense', 'transport', 'Fuel', 4200 + Math.round(rnd() * 1200));
      if (rnd() > 0.3) add(day(14), 'expense', 'fun', 'Cinema', 1250);
      add(day(16 + Math.floor(rnd() * 6)), 'expense', 'shopping', 'Online order', 1500 + Math.round(rnd() * 4500));
      add(day(26), 'expense', 'friends', 'Dinner out', 3800 + Math.round(rnd() * 2500), 'Birthday meal');
      if (k === 1) add(day(11), 'income', 'refund', 'Refund', 2499, 'Returned trainers');
    }
    const nextOn = (anchor) => {
      let d = U.addMonths(U.monthStart(today), 0, anchor);
      if (d <= today) d = U.addMonths(U.monthStart(today), 1, anchor);
      return d;
    };
    const rec = [
      ['Salary', 'income', 'salary', 215000, 1],
      ['Rent', 'expense', 'home', 82500, 1],
      ['Gym membership', 'expense', 'health', 3000, 3],
      ['Broadband', 'expense', 'bills', 3899, 21]
    ].map((r, i) => ({ id: 'exrec_' + i, name: r[0], type: r[1], categoryId: r[2], amount: r[3], freq: 'monthly', anchor: r[4], nextDate: nextOn(r[4]), paused: false, note: '', example: true, createdAt: now }));
    return { tx: tx, rec: rec };
  };
  A['load-examples'] = async () => {
    try {
      const ex = MT.examples();
      await S.addExamples(ex.tx, ex.rec);
      await S.setMeta('onboarded', true);
      await UI.closeSheet();
      UI.toast('Example data loaded. Remove it from Home whenever you like');
    } catch (e) {
      UI.error(e);
    }
  };
  A['clear-examples'] = async () => {
    const ok = await UI.confirm({ title: 'Remove example data?', body: 'Only the example entries are removed. Anything you added yourself stays.', ok: 'Remove examples', danger: true });
    if (!ok) return;
    try {
      const n = await S.clearExamples();
      UI.toast('Removed ' + n + ' example entries');
      if (!S.tx.length) MT.sheets.onboarding();
    } catch (e) {
      UI.error(e);
    }
  };

  /* ---------- Boot ---------- */
  async function boot() {
    try {
      await S.load();
    } catch (e) {
      document.getElementById('view').innerHTML = `<div class="fatal"><h1 class="h1">Couldn’t open your data</h1><p>${U.esc((e && e.message) || 'Storage error')}. Close the app fully and open it again. Your saved data has not been changed.</p></div>`;
      return;
    }
    const theme = S.settings().theme;
    UI.applyTheme(theme);
    try {
      localStorage.setItem('mt-theme', JSON.stringify(theme));
    } catch (e) {}
    UI.hideBalance = !!S.settings().hideOnOpen;
    let logged = 0;
    try {
      logged = await S.runRecurring();
    } catch (e) {
      console.error(e);
    }
    S.onChange(() => UI.refresh());
    history.replaceState({ route: { name: 'home', params: {} } }, '');
    UI.render({ entering: true });
    document.documentElement.classList.add('ready');

    let params;
    try {
      params = new URLSearchParams(location.search);
    } catch (e) {
      params = new URLSearchParams('');
    }
    if (params.get('add')) {
      MT.sheets.txForm(null, { type: params.get('add') === 'income' ? 'income' : 'expense' });
    } else if (params.get('view') === 'search') {
      UI.go('search');
    } else if (!S.meta.onboarded && !S.tx.length) {
      MT.sheets.onboarding();
    } else if (logged) {
      UI.toast(logged + ' recurring ' + (logged === 1 ? 'entry' : 'entries') + ' logged');
    }

    setTimeout(() => S.snapshotDaily().catch(() => {}), 1500);
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible') return;
      let n = 0;
      try {
        n = await S.runRecurring();
      } catch (e) {}
      S.snapshotDaily().catch(() => {});
      if (n) UI.toast(n + ' recurring ' + (n === 1 ? 'entry' : 'entries') + ' logged');
    });
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => UI.applyTheme(S.settings().theme));
    } catch (e) {}
    if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window && !MT.PREVIEW) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  boot();
})();

</script>
