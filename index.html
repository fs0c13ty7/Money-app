/* Money Tracker — IndexedDB wrapper. Every write is one atomic transaction with strict durability,
   and the UI only reports "saved" after the transaction has completed. */
(function () {
  'use strict';
  const MT = (window.MT = window.MT || {});
  const NAME = 'money-tracker';
  const VERSION = 1;
  let dbp = null;

  const D = (MT.db = { memory: false });

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      let req;
      try {
        req = indexedDB.open(NAME, VERSION);
      } catch (e) {
        reject(e);
        return;
      }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('tx')) db.createObjectStore('tx', { keyPath: 'id' }).createIndex('date', 'date');
        ['categories', 'recurring', 'snapshots'].forEach((n) => {
          if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: 'id' });
        });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('Storage is blocked by another open copy of the app.'));
    });
    return dbp;
  }

  D.init = async () => {
    try {
      await open();
    } catch (e) {
      D.memory = true;
      D.error = e;
    }
    return !D.memory;
  };

  D.all = async (store) => {
    if (D.memory) return [];
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, 'readonly');
      const q = t.objectStore(store).getAll();
      q.onsuccess = () => resolve(q.result || []);
      q.onerror = () => reject(q.error);
    });
  };

  /* ops: [{store, put: obj} | {store, del: key} | {store, clear: true}] — all applied atomically */
  D.write = async (ops) => {
    if (!ops.length || D.memory) return;
    const db = await open();
    const stores = Array.from(new Set(ops.map((o) => o.store)));
    return new Promise((resolve, reject) => {
      let t;
      try {
        t = db.transaction(stores, 'readwrite', { durability: 'strict' });
      } catch (e) {
        t = db.transaction(stores, 'readwrite');
      }
      ops.forEach((o) => {
        const s = t.objectStore(o.store);
        if (o.clear) s.clear();
        else if ('del' in o) s.delete(o.del);
        else s.put(o.put);
      });
      t.oncomplete = () => resolve();
      t.onerror = () => reject(t.error || new Error('Could not save.'));
      t.onabort = () => reject(t.error || new Error('Save was cancelled.'));
    });
  };

  /* Ask the browser to never evict our storage (Chrome grants this to installed apps) */
  D.persist = async () => {
    try {
      if (!navigator.storage || !navigator.storage.persist) return null;
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    } catch (e) {
      return null;
    }
  };
  D.persisted = async () => {
    try {
      return navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null;
    } catch (e) {
      return null;
    }
  };
})();

/* Money Tracker — in-memory state mirrored to IndexedDB. Memory is only updated after a write commits. */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const D = MT.db;

  const S = (MT.store = { tx: [], cats: [], rec: [], meta: {}, ready: false, listeners: [] });

  const DEFAULT_CATS = [
    ['bills', 'Bills & Utilities', 'expense', 'bills', 'blue'],
    ['fun', 'Entertainment', 'expense', 'fun', 'indigo'],
    ['family', 'Family', 'expense', 'family', 'teal'],
    ['fees', 'Fees & Charges', 'expense', 'fees', 'amber'],
    ['food', 'Food & Beverage', 'expense', 'food', 'orange'],
    ['friends', 'Friends & Lover', 'expense', 'heart', 'red'],
    ['gifts', 'Gifts & Donations', 'expense', 'gift', 'pink'],
    ['health', 'Health & Fitness', 'expense', 'health', 'green'],
    ['home', 'Home', 'expense', 'house', 'slate'],
    ['insure', 'Insurances', 'expense', 'insure', 'sky'],
    ['invest', 'Investment', 'expense', 'invest', 'green'],
    ['music', 'Music', 'expense', 'music', 'purple'],
    ['other', 'Other Expense', 'expense', 'box', 'slate', true],
    ['tout', 'Outgoing transfer', 'expense', 'out', 'slate', true],
    ['pet', 'Pet', 'expense', 'pet', 'amber'],
    ['shopping', 'Shopping', 'expense', 'bag', 'pink'],
    ['transport', 'Transportation', 'expense', 'bus', 'amber'],
    ['travel', 'Travel', 'expense', 'plane', 'sky'],
    ['award', 'Award', 'income', 'award', 'amber'],
    ['interest', 'Collect Interest', 'income', 'percent', 'orange'],
    ['igifts', 'Gifts', 'income', 'gift', 'pink'],
    ['tin', 'Incoming transfer', 'income', 'in', 'slate', true],
    ['iother', 'Other Income', 'income', 'box', 'slate', true],
    ['refund', 'Refund', 'income', 'refund', 'green'],
    ['salary', 'Salary', 'income', 'salary', 'green'],
    ['selling', 'Selling', 'income', 'tag', 'sky']
  ].map((c) => ({ id: c[0], name: c[1], type: c[2], icon: c[3], color: c[4], builtIn: !!c[5] }));

  const ADJUST = { id: 'adjust', name: 'Balance adjustment', type: 'system', icon: 'sliders', color: 'slate', builtIn: true, system: true };

  const DEFAULT_SETTINGS = { theme: 'system', hideOnOpen: false, weekStart: 1 };
  const DEFAULT_META = {
    onboarded: false,
    lastFileBackup: null,
    lastSnapshot: null,
    dismissed: [],
    recentSearches: []
  };

  S.onChange = (fn) => S.listeners.push(fn);
  S.emit = () => S.listeners.forEach((fn) => {
    try {
      fn();
    } catch (e) {
      console.error(e);
    }
  });

  S.sortTx = () =>
    S.tx.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0)));

  S.load = async () => {
    await D.init();
    const res = await Promise.all(['tx', 'categories', 'recurring', 'meta'].map((s) => D.all(s)));
    S.tx = res[0];
    S.cats = res[1];
    S.rec = res[2];
    S.meta = {};
    res[3].forEach((m) => (S.meta[m.key] = m.value));
    const ops = [];
    if (!S.cats.length) {
      S.cats = DEFAULT_CATS.map((c) => Object.assign({}, c));
      S.cats.forEach((c) => ops.push({ store: 'categories', put: c }));
    }
    if (!S.cats.find((c) => c.id === 'adjust')) {
      S.cats.push(Object.assign({}, ADJUST));
      ops.push({ store: 'categories', put: ADJUST });
    }
    Object.keys(DEFAULT_META).forEach((k) => {
      if (!(k in S.meta)) S.meta[k] = JSON.parse(JSON.stringify(DEFAULT_META[k]));
    });
    S.meta.settings = Object.assign({}, DEFAULT_SETTINGS, S.meta.settings || {});
    await D.write(ops);
    S.sortTx();
    S.ready = true;
  };

  S.setMeta = async (key, value) => {
    await D.write([{ store: 'meta', put: { key: key, value: value } }]);
    S.meta[key] = value;
  };
  S.settings = () => S.meta.settings;
  S.setSetting = async (k, v) => {
    const next = Object.assign({}, S.meta.settings, { [k]: v });
    await S.setMeta('settings', next);
    if (k === 'theme') {
      try {
        localStorage.setItem('mt-theme', JSON.stringify(v));
      } catch (e) {}
    }
  };

  /* ---------- Categories ---------- */
  S.cat = (id) => S.cats.find((c) => c.id === id) || { id: id, name: 'Unknown', icon: 'box', color: 'slate', type: 'expense' };
  S.catsOf = (type) =>
    S.cats.filter((c) => c.type === type && !c.system).sort((a, b) => a.name.localeCompare(b.name, 'en-GB', { sensitivity: 'base' }));
  S.fallbackFor = (type) => (type === 'income' ? 'iother' : 'other');

  /* categories ordered by how often they've been used in the last 6 months */
  S.catsByUse = (type) => {
    const since = U.addDays(U.today(), -183);
    const n = {};
    S.tx.forEach((t) => {
      if (t.date >= since) n[t.categoryId] = (n[t.categoryId] || 0) + 1;
    });
    return S.catsOf(type).sort((a, b) => (n[b.id] || 0) - (n[a.id] || 0));
  };

  S.saveCategory = async (c) => {
    const name = String(c.name || '').trim().replace(/\s+/g, ' ');
    if (!name) throw new Error('Give the category a name.');
    if (name.length > 40) throw new Error('Keep the name under 40 characters.');
    const clash = S.cats.find((x) => x.type === c.type && x.id !== c.id && x.name.toLowerCase() === name.toLowerCase());
    if (clash) throw new Error('You already have a category called ' + clash.name + '.');
    const existing = c.id ? S.cats.find((x) => x.id === c.id) : null;
    const out = Object.assign({}, existing || {}, {
      id: c.id || U.uid('cat'),
      name: name,
      type: c.type,
      icon: c.icon || 'box',
      color: c.color || 'slate',
      builtIn: existing ? !!existing.builtIn : false
    });
    await D.write([{ store: 'categories', put: out }]);
    const i = S.cats.findIndex((x) => x.id === out.id);
    if (i >= 0) S.cats[i] = out;
    else S.cats.push(out);
    S.emit();
    return out;
  };

  /* Removing a category never deletes transactions: they move to Other Expense / Other Income */
  S.removeCategory = async (id) => {
    const c = S.cats.find((x) => x.id === id);
    if (!c || c.builtIn) throw new Error('Built-in categories can’t be removed.');
    const fb = S.fallbackFor(c.type);
    const txs = S.tx.filter((t) => t.categoryId === id);
    const recs = S.rec.filter((r) => r.categoryId === id);
    const ops = [];
    txs.forEach((t) => ops.push({ store: 'tx', put: Object.assign({}, t, { categoryId: fb, updatedAt: Date.now() }) }));
    recs.forEach((r) => ops.push({ store: 'recurring', put: Object.assign({}, r, { categoryId: fb }) }));
    ops.push({ store: 'categories', del: id });
    await D.write(ops);
    txs.forEach((t) => (t.categoryId = fb));
    recs.forEach((r) => (r.categoryId = fb));
    S.cats = S.cats.filter((x) => x.id !== id);
    S.emit();
    return { cat: c, txIds: txs.map((t) => t.id), recIds: recs.map((r) => r.id), fallback: fb };
  };
  S.undoRemoveCategory = async (info) => {
    const ops = [{ store: 'categories', put: info.cat }];
    const txs = S.tx.filter((t) => info.txIds.indexOf(t.id) >= 0);
    const recs = S.rec.filter((r) => info.recIds.indexOf(r.id) >= 0);
    txs.forEach((t) => ops.push({ store: 'tx', put: Object.assign({}, t, { categoryId: info.cat.id }) }));
    recs.forEach((r) => ops.push({ store: 'recurring', put: Object.assign({}, r, { categoryId: info.cat.id }) }));
    await D.write(ops);
    txs.forEach((t) => (t.categoryId = info.cat.id));
    recs.forEach((r) => (r.categoryId = info.cat.id));
    S.cats.push(info.cat);
    S.emit();
  };

  /* ---------- Transactions ---------- */
  function cleanTx(t) {
    const amount = Math.round(Number(t.amount));
    if (!Number.isSafeInteger(amount) || amount <= 0) throw new Error('Enter an amount above £0.00.');
    if (amount > 100000000000) throw new Error('That amount looks too large.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) throw new Error('Pick a valid date.');
    if (t.type !== 'expense' && t.type !== 'income') throw new Error('Choose expense or income.');
    if (!S.cats.find((c) => c.id === t.categoryId)) throw new Error('Pick a category.');
    const prev = t.id ? S.tx.find((x) => x.id === t.id) : null;
    return {
      id: t.id || U.uid('tx'),
      type: t.type,
      amount: amount,
      categoryId: t.categoryId,
      name: String(t.name || '').trim().slice(0, 80),
      note: String(t.note || '').trim().slice(0, 500),
      date: t.date,
      recurringId: t.recurringId || (prev && prev.recurringId) || null,
      example: prev ? !!prev.example : !!t.example,
      excluded: prev ? !!prev.excluded : !!t.excluded,
      source: (prev && prev.source) || t.source || null,
      createdAt: (prev && prev.createdAt) || t.createdAt || Date.now(),
      updatedAt: Date.now()
    };
  }

  /* ---------- Example data (clearly flagged, removable in one tap) ---------- */
  S.hasExamples = () => S.tx.some((t) => t.example) || S.rec.some((r) => r.example);
  S.addExamples = async (txs, recs) => {
    const ops = [];
    txs.forEach((t) => ops.push({ store: 'tx', put: t }));
    recs.forEach((r) => ops.push({ store: 'recurring', put: r }));
    await D.write(ops);
    txs.forEach((t) => S.tx.push(t));
    recs.forEach((r) => S.rec.push(r));
    S.sortTx();
    S.emit();
  };
  S.addBatch = async (cats, txs) => {
    const ops = cats.map((c) => ({ store: 'categories', put: c })).concat(txs.map((t) => ({ store: 'tx', put: t })));
    await D.write(ops);
    cats.forEach((c) => S.cats.push(c));
    txs.forEach((t) => S.tx.push(t));
    S.sortTx();
    S.emit();
  };
  S.clearExamples = async () => {
    const txs = S.tx.filter((t) => t.example);
    const recs = S.rec.filter((r) => r.example);
    await D.write(txs.map((t) => ({ store: 'tx', del: t.id })).concat(recs.map((r) => ({ store: 'recurring', del: r.id }))));
    S.tx = S.tx.filter((t) => !t.example);
    S.rec = S.rec.filter((r) => !r.example);
    S.emit();
    return txs.length;
  };
  S.saveTx = async (t) => {
    const c = cleanTx(t);
    await D.write([{ store: 'tx', put: c }]);
    const i = S.tx.findIndex((x) => x.id === c.id);
    if (i >= 0) S.tx[i] = c;
    else S.tx.push(c);
    S.sortTx();
    S.emit();
    return c;
  };
  S.deleteTx = async (id) => {
    const t = S.tx.find((x) => x.id === id);
    if (!t) return null;
    await D.write([{ store: 'tx', del: id }]);
    S.tx = S.tx.filter((x) => x.id !== id);
    S.emit();
    return t;
  };
  S.restoreTx = async (t) => {
    await D.write([{ store: 'tx', put: t }]);
    if (!S.tx.find((x) => x.id === t.id)) S.tx.push(t);
    S.sortTx();
    S.emit();
  };

  S.signed = (t) => (t.type === 'income' ? t.amount : -t.amount);
  S.balance = () => S.tx.reduce((a, t) => a + S.signed(t), 0);
  S.isStat = (t) => t.categoryId !== 'adjust' && !t.excluded;
  S.range = (from, to) => S.tx.filter((t) => t.date >= from && t.date <= to);
  S.totals = (from, to) => {
    let inn = 0;
    let out = 0;
    S.range(from, to).forEach((t) => {
      if (!S.isStat(t)) return;
      if (t.type === 'income') inn += t.amount;
      else out += t.amount;
    });
    return { in: inn, out: out, net: inn - out };
  };
  S.byCategory = (from, to, type) => {
    const m = {};
    S.range(from, to).forEach((t) => {
      if (!S.isStat(t) || t.type !== (type || 'expense')) return;
      const r = m[t.categoryId] || (m[t.categoryId] = { cat: S.cat(t.categoryId), total: 0, count: 0 });
      r.total += t.amount;
      r.count += 1;
    });
    return Object.values(m).sort((a, b) => b.total - a.total);
  };
  S.dailySpend = (from, to) => {
    const m = {};
    S.range(from, to).forEach((t) => {
      if (S.isStat(t) && t.type === 'expense') m[t.date] = (m[t.date] || 0) + t.amount;
    });
    return m;
  };
  /* cumulative spend per day of a month: array index 0 = day 1 */
  S.monthCumulative = (monthIso) => {
    const start = U.monthStart(monthIso);
    const end = U.monthEnd(monthIso);
    const days = Number(end.slice(8));
    const daily = S.dailySpend(start, end);
    const out = [];
    let run = 0;
    for (let d = 1; d <= days; d++) {
      run += daily[start.slice(0, 8) + String(d).padStart(2, '0')] || 0;
      out.push(run);
    }
    return out;
  };
  S.firstDate = () => (S.tx.length ? S.tx[S.tx.length - 1].date : null);

  /* ---------- Recurring ---------- */
  S.nextOcc = (r, iso) => {
    if (r.freq === 'weekly') return U.addDays(iso, 7);
    if (r.freq === 'yearly') return U.addMonths(iso, 12, r.anchor);
    return U.addMonths(iso, 1, r.anchor);
  };
  S.saveRecurring = async (r) => {
    const amount = Math.round(Number(r.amount));
    if (!Number.isSafeInteger(amount) || amount <= 0) throw new Error('Enter an amount above £0.00.');
    if (!String(r.name || '').trim()) throw new Error('Give it a name, like “Netflix”.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(r.nextDate || '')) throw new Error('Pick the next due date.');
    if (!S.cats.find((c) => c.id === r.categoryId)) throw new Error('Pick a category.');
    const prev = r.id ? S.rec.find((x) => x.id === r.id) : null;
    const out = {
      id: r.id || U.uid('rec'),
      type: r.type === 'income' ? 'income' : 'expense',
      amount: amount,
      categoryId: r.categoryId,
      name: String(r.name).trim().slice(0, 80),
      note: String(r.note || '').trim().slice(0, 500),
      freq: ['weekly', 'monthly', 'yearly'].indexOf(r.freq) >= 0 ? r.freq : 'monthly',
      anchor: r.anchor && r.anchor >= 1 && r.anchor <= 31 ? r.anchor : Number(r.nextDate.slice(8)),
      nextDate: r.nextDate,
      paused: !!r.paused,
      example: prev ? !!prev.example : false,
      createdAt: (prev && prev.createdAt) || Date.now()
    };
    await D.write([{ store: 'recurring', put: out }]);
    const i = S.rec.findIndex((x) => x.id === out.id);
    if (i >= 0) S.rec[i] = out;
    else S.rec.push(out);
    await S.runRecurring();
    S.emit();
    return out;
  };
  S.deleteRecurring = async (id) => {
    const r = S.rec.find((x) => x.id === id);
    await D.write([{ store: 'recurring', del: id }]);
    S.rec = S.rec.filter((x) => x.id !== id);
    S.emit();
    return r;
  };
  S.restoreRecurring = async (r) => {
    await D.write([{ store: 'recurring', put: r }]);
    S.rec.push(r);
    S.emit();
  };
  /* Log every due occurrence up to today. Ids are deterministic, so this can never double-log. */
  S.runRecurring = async () => {
    const today = U.today();
    const ops = [];
    const added = [];
    const updated = [];
    S.rec.forEach((r) => {
      if (r.paused) return;
      let n = r.nextDate;
      let guard = 0;
      while (n <= today && guard < 600) {
        const id = 'r_' + r.id + '_' + n;
        if (!S.tx.find((t) => t.id === id)) {
          const cat = S.cats.find((c) => c.id === r.categoryId) ? r.categoryId : S.fallbackFor(r.type);
          const t = { id: id, type: r.type, amount: r.amount, categoryId: cat, name: r.name, note: r.note || '', date: n, recurringId: r.id, example: !!r.example, createdAt: Date.now(), updatedAt: Date.now() };
          ops.push({ store: 'tx', put: t });
          added.push(t);
        }
        n = S.nextOcc(r, n);
        guard++;
      }
      if (n !== r.nextDate) {
        const nr = Object.assign({}, r, { nextDate: n });
        ops.push({ store: 'recurring', put: nr });
        updated.push(nr);
      }
    });
    if (!ops.length) return 0;
    await D.write(ops);
    added.forEach((t) => S.tx.push(t));
    updated.forEach((nr) => {
      const i = S.rec.findIndex((x) => x.id === nr.id);
      if (i >= 0) S.rec[i] = nr;
    });
    S.sortTx();
    S.emit();
    return added.length;
  };
  S.upcoming = (days) => {
    const end = U.addDays(U.today(), days);
    const out = [];
    S.rec.forEach((r) => {
      if (r.paused) return;
      let n = r.nextDate;
      let g = 0;
      while (n <= end && g < 60) {
        out.push({ rule: r, date: n });
        n = S.nextOcc(r, n);
        g++;
      }
    });
    return out.sort((a, b) => (a.date < b.date ? -1 : 1));
  };
  S.monthlyEquivalent = (r) => (r.freq === 'weekly' ? Math.round((r.amount * 52) / 12) : r.freq === 'yearly' ? Math.round(r.amount / 12) : r.amount);

  /* ---------- Backup, restore, snapshots ---------- */
  S.exportData = () => ({
    app: 'money-tracker',
    format: 1,
    exportedAt: new Date().toISOString(),
    tx: S.tx,
    categories: S.cats,
    recurring: S.rec,
    settings: S.meta.settings
  });

  S.validateImport = (obj) => {
    if (!obj || obj.app !== 'money-tracker' || !Array.isArray(obj.tx) || !Array.isArray(obj.categories)) {
      return { ok: false, error: 'This isn’t a Money Tracker backup file.' };
    }
    const cats = obj.categories.filter((c) => c && typeof c.id === 'string' && typeof c.name === 'string');
    if (!cats.find((c) => c.id === 'adjust')) cats.push(Object.assign({}, ADJUST));
    DEFAULT_CATS.filter((c) => c.builtIn).forEach((c) => {
      if (!cats.find((x) => x.id === c.id)) cats.push(Object.assign({}, c));
    });
    const ids = new Set(cats.map((c) => c.id));
    let skipped = 0;
    const tx = [];
    obj.tx.forEach((t) => {
      const ok = t && typeof t.id === 'string' && Number.isSafeInteger(t.amount) && t.amount > 0 && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && (t.type === 'income' || t.type === 'expense');
      if (!ok) {
        skipped++;
        return;
      }
      tx.push(Object.assign({}, t, { categoryId: ids.has(t.categoryId) ? t.categoryId : S.fallbackFor(t.type) }));
    });
    const rec = (obj.recurring || []).filter((r) => r && typeof r.id === 'string' && Number.isSafeInteger(r.amount) && /^\d{4}-\d{2}-\d{2}$/.test(r.nextDate));
    const dates = tx.map((t) => t.date).sort();
    return {
      ok: true,
      data: { tx: tx, categories: cats, recurring: rec, settings: obj.settings || null },
      summary: {
        tx: tx.length,
        skipped: skipped,
        cats: cats.filter((c) => !c.system).length,
        rec: rec.length,
        from: dates[0] || null,
        to: dates[dates.length - 1] || null,
        balance: tx.reduce((a, t) => a + (t.type === 'income' ? t.amount : -t.amount), 0),
        exportedAt: obj.exportedAt || null
      }
    };
  };

  S.snapshot = async (kind) => {
    const now = Date.now();
    const snap = { id: (kind === 'daily' ? 'd_' + U.today() : 'p_' + now), kind: kind, createdAt: now, count: S.tx.length, balance: S.balance(), data: S.exportData() };
    await D.write([{ store: 'snapshots', put: snap }]);
    return snap;
  };
  S.snapshotDaily = async () => {
    if (D.memory || !S.tx.length || S.meta.lastSnapshot === U.today()) return;
    await S.snapshot('daily');
    await S.setMeta('lastSnapshot', U.today());
    const all = await D.all('snapshots');
    const daily = all.filter((s) => s.kind === 'daily').sort((a, b) => b.createdAt - a.createdAt);
    const other = all.filter((s) => s.kind !== 'daily').sort((a, b) => b.createdAt - a.createdAt);
    const drop = daily.slice(30).concat(other.slice(10));
    if (drop.length) await D.write(drop.map((s) => ({ store: 'snapshots', del: s.id })));
  };
  S.listSnapshots = async () => (await D.all('snapshots')).sort((a, b) => b.createdAt - a.createdAt);

  S.replaceAll = async (data) => {
    if (S.tx.length) await S.snapshot('restore');
    const ops = [{ store: 'tx', clear: true }, { store: 'categories', clear: true }, { store: 'recurring', clear: true }];
    data.tx.forEach((t) => ops.push({ store: 'tx', put: t }));
    data.categories.forEach((c) => ops.push({ store: 'categories', put: c }));
    data.recurring.forEach((r) => ops.push({ store: 'recurring', put: r }));
    await D.write(ops);
    S.tx = data.tx.slice();
    S.cats = data.categories.slice();
    S.rec = data.recurring.slice();
    S.sortTx();
    if (data.settings) await S.setMeta('settings', Object.assign({}, DEFAULT_SETTINGS, data.settings));
    await S.runRecurring();
    S.emit();
  };

  S.toCSV = () => {
    const q = (v) => {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const rows = [['Date', 'Type', 'Category', 'Name', 'Note', 'Amount (GBP)']];
    S.tx
      .slice()
      .reverse()
      .forEach((t) => rows.push([t.date, t.type, S.cat(t.categoryId).name, t.name, t.note, ((t.type === 'income' ? 1 : -1) * t.amount / 100).toFixed(2)]));
    return rows.map((r) => r.map(q).join(',')).join('\n');
  };
})();

/* Money Tracker — on-device smart features: auto-category, type-to-log, forecast, watchdog alerts.
   Nothing here leaves the phone. */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const S = MT.store;
  const X = (MT.smart = {});

  X.norm = (s) =>
    String(s || '')
      .toLowerCase()
      .replace(/[^a-z0-9& ]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

  const KEYWORDS = {
    food: 'coffee lunch dinner breakfast brunch cafe café restaurant pizza takeaway tea pub bar drinks snack snacks food groceries grocery tesco sainsbury sainsburys asda aldi lidl morrisons waitrose coop co op greggs mcdonalds mcdonald kfc nandos starbucks costa pret deliveroo justeat ubereats burger chippy',
    transport: 'uber bolt taxi cab bus train rail tfl fuel petrol diesel parking toll trainline metro tram',
    bills: 'broadband electric electricity gas water council tax phone mobile rent ee vodafone o2 three bt sky virgin licence wifi energy octopus',
    shopping: 'amazon ebay clothes shoes argos primark ikea asos shopping',
    health: 'gym pharmacy boots dentist doctor physio vitamins',
    fun: 'cinema film netflix disney steam playstation xbox concert gig theatre bowling',
    music: 'spotify music vinyl guitar',
    pet: 'vet pet dog cat pets',
    travel: 'hotel flight flights airbnb holiday hostel',
    gifts: 'gift present donation charity birthday',
    insure: 'insurance',
    fees: 'fee fees charge overdraft',
    home: 'diy furniture homebase cleaning',
    invest: 'invest isa shares stocks',
    salary: 'salary wage wages pay payroll payday',
    refund: 'refund refunded return',
    selling: 'sold vinted sale',
    interest: 'interest',
    award: 'bonus award prize'
  };
  const KW = {};
  Object.keys(KEYWORDS).forEach((cat) => KEYWORDS[cat].split(' ').forEach((w) => (KW[w] = cat)));

  /* Best category for a name: your own history first, then common keywords */
  X.suggestCategory = (name, type) => {
    const n = X.norm(name);
    if (!n) return null;
    const counts = {};
    S.tx.forEach((t) => {
      if (t.type === type && S.isStat(t) && X.norm(t.name) === n) counts[t.categoryId] = (counts[t.categoryId] || 0) + 1;
    });
    const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    if (best && S.cats.find((c) => c.id === best)) return best;
    const words = n.split(' ');
    for (let i = 0; i < words.length; i++) {
      const id = KW[words[i]];
      const c = id && S.cats.find((x) => x.id === id);
      if (c && c.type === type) return id;
    }
    const joined = n.replace(/ /g, '');
    if (KW[joined]) {
      const c = S.cats.find((x) => x.id === KW[joined]);
      if (c && c.type === type) return c.id;
    }
    return null;
  };

  /* Past names that start with / contain what's typed, most recent first */
  X.nameSuggestions = (text, type, limit) => {
    const n = X.norm(text);
    if (n.length < 1) return [];
    const seen = new Set();
    const out = [];
    for (let i = 0; i < S.tx.length && out.length < (limit || 4); i++) {
      const t = S.tx[i];
      if (t.type !== type || !t.name || !S.isStat(t)) continue;
      const tn = X.norm(t.name);
      if (seen.has(tn) || tn === n || tn.indexOf(n) === -1) continue;
      seen.add(tn);
      out.push({ name: t.name, categoryId: t.categoryId, amount: t.amount });
    }
    return out;
  };

  /* "coffee 3.40 yesterday" -> { amount, date, name, type, categoryId } */
  const WD = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  X.parse = (text, currentType) => {
    let s = ' ' + String(text || '').trim() + ' ';
    if (!s.trim()) return null;
    const out = {};
    const amt = s.match(/\s([+-])?£?(\d{1,7}(?:[.,]\d{1,2})?)(?=\s)/);
    if (amt) {
      const p = U.parseMoney(amt[2].replace(',', '.'));
      if (p) {
        out.amount = p;
        if (amt[1] === '+') out.type = 'income';
        s = s.replace(amt[0], ' ');
      }
    }
    const today = U.today();
    const lower = s.toLowerCase();
    let m;
    if (/\b(today|tonight)\b/.test(lower)) {
      out.date = today;
      s = s.replace(/\b(today|tonight)\b/i, ' ');
    } else if (/\byesterday\b/.test(lower)) {
      out.date = U.addDays(today, -1);
      s = s.replace(/\byesterday\b/i, ' ');
    } else if ((m = lower.match(/\b(?:last |on )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/))) {
      const idx = WD.indexOf(m[1]);
      if (idx >= 0) {
        const d = U.parse(today);
        let back = (d.getDay() - idx + 7) % 7;
        if (back === 0 && /last/.test(m[0])) back = 7;
        out.date = U.addDays(today, -back);
        s = s.replace(new RegExp(m[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), ' ');
      }
    } else if ((m = lower.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
      const dd = Number(m[1]);
      const mm = Number(m[2]);
      let yy = m[3] ? Number(m[3]) : Number(today.slice(0, 4));
      if (yy < 100) yy += 2000;
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= U.dim(yy, mm - 1)) {
        let iso = yy + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
        if (!m[3] && iso > today) iso = yy - 1 + iso.slice(4);
        out.date = iso;
        s = s.replace(m[0], ' ');
      }
    }
    if (/\b(income|received|got paid)\b/i.test(s)) {
      out.type = 'income';
      s = s.replace(/\b(income|received|got paid)\b/i, ' ');
    }
    const name = s.replace(/\b(on|for|at|spent|paid)\b/gi, ' ').replace(/\s+/g, ' ').trim();
    if (name) out.name = name.charAt(0).toUpperCase() + name.slice(1);
    const type = out.type || currentType || 'expense';
    let cat = out.name ? X.suggestCategory(out.name, type) : null;
    if (!cat && !out.type && out.name) {
      const inc = X.suggestCategory(out.name, 'income');
      if (inc && ['salary', 'refund', 'selling', 'interest', 'award'].indexOf(inc) >= 0) {
        out.type = 'income';
        cat = inc;
      }
    }
    if (cat) out.categoryId = cat;
    if (!out.amount && !out.date) return null;
    return out;
  };

  /* ---------- Forecast: where this month's spending is heading ---------- */
  X.forecast = (monthIso) => {
    const start = U.monthStart(monthIso);
    const days = Number(U.monthEnd(start).slice(8));
    const today = U.today();
    const isCurrent = U.monthStart(today) === start;
    const dayIdx = isCurrent ? Number(today.slice(8)) : today > start ? days : 0;
    const actual = S.monthCumulative(start);
    /* average cumulative of the previous 3 months that have data */
    const prev = [];
    for (let k = 1; k <= 3; k++) {
      const ms = U.addMonths(start, -k, 1);
      const first = S.firstDate();
      if (!first || U.monthEnd(ms) < first) continue;
      const cum = S.monthCumulative(ms);
      if (cum[cum.length - 1] > 0) prev.push(cum);
    }
    let avg = null;
    if (prev.length) {
      avg = [];
      for (let d = 0; d < days; d++) {
        let sum = 0;
        prev.forEach((c) => (sum += c[Math.min(d, c.length - 1)]));
        avg.push(Math.round(sum / prev.length));
      }
    }
    const spent = dayIdx ? actual[dayIdx - 1] : 0;
    let projection = null;
    let projSeries = null;
    if (isCurrent && dayIdx < days) {
      if (avg) {
        const base = avg[dayIdx - 1];
        projSeries = [];
        for (let d = dayIdx - 1; d < days; d++) projSeries.push(spent + Math.max(0, avg[d] - base));
        projection = projSeries[projSeries.length - 1];
      } else if (dayIdx >= 5 && spent > 0) {
        const perDay = spent / dayIdx;
        projSeries = [];
        for (let d = dayIdx - 1; d < days; d++) projSeries.push(Math.round(perDay * (d + 1)));
        projection = projSeries[projSeries.length - 1];
      }
    }
    return {
      start: start,
      days: days,
      dayIdx: dayIdx,
      isCurrent: isCurrent,
      actual: actual,
      avg: avg,
      avgMonths: prev.length,
      spent: spent,
      avgToDate: avg && dayIdx ? avg[dayIdx - 1] : null,
      projection: projection,
      projSeries: projSeries
    };
  };

  /* ---------- Watchdog alerts ---------- */
  X.alerts = () => {
    const out = [];
    const today = U.today();
    const recent = S.tx.filter((t) => S.isStat(t) && t.date >= U.addDays(today, -14));
    /* possible double charges */
    for (let i = 0; i < recent.length; i++) {
      for (let j = i + 1; j < recent.length; j++) {
        const a = recent[i];
        const b = recent[j];
        if (a.type !== 'expense' || b.type !== 'expense' || a.amount !== b.amount) continue;
        if (a.recurringId && b.recurringId) continue;
        if (Math.abs(U.daysBetween(a.date, b.date)) > 1) continue;
        const sameName = X.norm(a.name) && X.norm(a.name) === X.norm(b.name);
        const sameCatNoName = !a.name && !b.name && a.categoryId === b.categoryId;
        if (!sameName && !sameCatNoName) continue;
        const ids = [a.id, b.id].sort();
        out.push({
          id: 'dup:' + ids.join(':'),
          kind: 'warn',
          icon: 'alert',
          title: 'Possible double entry',
          body: (a.name || S.cat(a.categoryId).name) + ' · ' + U.fmt(a.amount) + ' logged twice, ' + U.fmtDay(b.date === a.date ? a.date : b.date) + '.',
          txId: a.id
        });
      }
    }
    /* price changes on regular payments (same name, roughly monthly) */
    const byName = {};
    S.tx.forEach((t) => {
      if (t.type !== 'expense' || !S.isStat(t) || !t.name) return;
      (byName[X.norm(t.name)] = byName[X.norm(t.name)] || []).push(t);
    });
    Object.keys(byName).forEach((k) => {
      const list = byName[k];
      /* only for steady payments: the two before the latest were the same price, about a month apart */
      if (list.length < 3) return;
      const a = list[0];
      const b = list[1];
      const c = list[2];
      const gap = U.daysBetween(b.date, a.date);
      const gap2 = U.daysBetween(c.date, b.date);
      if (a.date < U.addDays(today, -40) || gap < 24 || gap > 38 || gap2 < 24 || gap2 > 38) return;
      if (b.amount !== c.amount || a.amount === b.amount) return;
      const up = a.amount > b.amount;
      out.push({
        id: 'price:' + a.id,
        kind: up ? 'warn' : 'info',
        icon: up ? 'up' : 'down',
        title: a.name + (up ? ' went up' : ' went down'),
        body: U.fmt(b.amount) + ' → ' + U.fmt(a.amount) + ' (' + (up ? '+' : '−') + U.fmt(Math.abs(a.amount - b.amount)) + ' a month).',
        txId: a.id
      });
    });
    /* unusually large spends in the last week, against that category's last 90 days */
    S.tx.forEach((t) => {
      if (t.type !== 'expense' || !S.isStat(t) || t.date < U.addDays(today, -7) || t.recurringId) return;
      const pool = S.tx.filter((h) => h.id !== t.id && h.type === 'expense' && h.date < t.date && h.date >= U.addDays(t.date, -90));
      const sameName = X.norm(t.name) ? pool.filter((h) => X.norm(h.name) === X.norm(t.name)) : [];
      const hist = (sameName.length >= 3 ? sameName : pool.filter((h) => h.categoryId === t.categoryId && !(X.norm(t.name) && X.norm(h.name) && X.norm(h.name) !== X.norm(t.name))))
        .map((h) => h.amount)
        .sort((x, y) => x - y);
      if (hist.length < 3) return;
      const median = hist[Math.floor(hist.length / 2)];
      if (t.amount >= 2000 && t.amount > median * 3) {
        out.push({
          id: 'big:' + t.id,
          kind: 'info',
          icon: 'info',
          title: 'Bigger than usual',
          body: (t.name || S.cat(t.categoryId).name) + ' · ' + U.fmt(t.amount) + ' is about ' + Math.round(t.amount / median) + '× what you usually spend' + (sameName.length >= 3 ? ' there.' : ' on ' + S.cat(t.categoryId).name + '.'),
          txId: t.id
        });
      }
    });
    const dismissed = new Set(S.meta.dismissed || []);
    return out.filter((a) => !dismissed.has(a.id)).slice(0, 3);
  };
})();

/* Money Tracker — hand-drawn SVG charts with touch/hover tooltips. Colours come from CSS tokens. */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const C = (MT.charts = { reg: {} });
  let seq = 0;

  C.niceMax = (v) => {
    if (!v || v <= 0) return 10000;
    const exp = Math.pow(10, Math.floor(Math.log10(v)));
    const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (let i = 0; i < steps.length; i++) if (steps[i] * exp >= v) return steps[i] * exp;
    return 10 * exp;
  };
  const f1 = (n) => Math.round(n * 10) / 10;

  /* ---------- Month line: cumulative spend vs 3-month average, with forecast ---------- */
  C.monthLine = (fc, opts) => {
    const o = opts || {};
    const id = 'ch' + ++seq;
    const W = 340;
    const H = 168;
    const top = 12;
    const bottom = 140;
    const days = fc.days;
    const shown = fc.isCurrent ? fc.dayIdx : days;
    const vals = fc.actual.slice(0, shown);
    let max = Math.max(vals[vals.length - 1] || 0, fc.avg ? fc.avg[days - 1] : 0, fc.projection || 0);
    max = C.niceMax(max * 1.05);
    const x = (d) => f1((d / (days - 1)) * W);
    const y = (v) => f1(bottom - (v / max) * (bottom - top));
    const line = (arr, off) => arr.map((v, i) => (i ? 'L' : 'M') + x(i + (off || 0)) + ' ' + y(v)).join('');
    let svg = '';
    [0.5, 1].forEach((g) => {
      const gy = y(max * g);
      svg += `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" class="grid"></line><text x="${W}" y="${gy - 5}" text-anchor="end" class="axis">${U.fmtShort(max * g)}</text>`;
    });
    svg += `<line x1="0" x2="${W}" y1="${bottom}" y2="${bottom}" class="base"></line>`;
    if (fc.avg) svg += `<path d="${line(fc.avg)}" class="avg"></path>`;
    if (vals.length) {
      const area = line(vals) + `L${x(vals.length - 1)} ${bottom}L0 ${bottom}Z`;
      svg += `<path d="${area}" class="area"></path>`;
      svg += `<path d="${line(vals)}" class="actual${o.animate ? ' draw' : ''}" pathLength="1"></path>`;
    }
    if (fc.projSeries && fc.projSeries.length > 1) svg += `<path d="${line(fc.projSeries, fc.dayIdx - 1)}" class="proj"></path>`;
    if (fc.isCurrent && fc.dayIdx) {
      const tx = x(fc.dayIdx - 1);
      svg += `<line x1="${tx}" x2="${tx}" y1="${top}" y2="${bottom}" class="today"></line>`;
      if (fc.avg) svg += `<circle cx="${tx}" cy="${y(fc.avg[fc.dayIdx - 1])}" r="3.5" class="dot-avg"></circle>`;
      svg += `<circle cx="${tx}" cy="${y(vals[vals.length - 1] || 0)}" r="5" class="dot"></circle>`;
    }
    const startLbl = U.fmtShortDate(fc.start);
    const endLbl = U.fmtShortDate(U.monthEnd(fc.start));
    svg += `<text x="0" y="${H - 4}" class="axis">${startLbl}</text>`;
    if (fc.isCurrent && fc.dayIdx > 4 && fc.dayIdx < days - 3) svg += `<text x="${x(fc.dayIdx - 1)}" y="${H - 4}" text-anchor="middle" class="axis strong">Today</text>`;
    svg += `<text x="${W}" y="${H - 4}" text-anchor="end" class="axis">${endLbl}</text>`;
    svg += `<line class="cross" x1="0" x2="0" y1="${top}" y2="${bottom}" visibility="hidden"></line><circle class="cross-dot" r="4.5" cx="0" cy="0" visibility="hidden"></circle><circle class="cross-dot2" r="3.5" cx="0" cy="0" visibility="hidden"></circle>`;
    C.reg[id] = { kind: 'line', fc: fc, max: max, W: W, top: top, bottom: bottom };
    const label = `Spending so far in ${U.fmtMonth(fc.start)}: ${U.fmt(fc.spent)}` + (fc.avgToDate != null ? `, against a usual ${U.fmt(fc.avgToDate)} by this point.` : '.');
    return `<div class="chart" data-chart-id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(label)}" class="chart-svg line-chart">${svg}<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="hit"></rect></svg><div class="chart-tip" hidden></div></div>`;
  };

  /* ---------- Grouped bars: income vs spending by month ---------- */
  C.monthBars = (months) => {
    const id = 'ch' + ++seq;
    const W = 340;
    const H = 176;
    const top = 14;
    const bottom = 150;
    const n = months.length;
    const max = C.niceMax(Math.max.apply(null, months.map((m) => Math.max(m.in, m.out)).concat([1])) * 1.05);
    const gw = W / n;
    const bw = Math.min(16, gw / 3);
    const y = (v) => f1(bottom - (v / max) * (bottom - top));
    const bar = (x0, v, cls) => {
      const h = bottom - y(v);
      if (v <= 0) return '';
      const r = Math.min(4, h, bw / 2);
      const x1 = f1(x0 + bw);
      const yt = y(v);
      return `<path class="${cls}" d="M${f1(x0)} ${bottom}V${f1(yt + r)}Q${f1(x0)} ${yt} ${f1(x0 + r)} ${yt}H${f1(x1 - r)}Q${x1} ${yt} ${x1} ${f1(yt + r)}V${bottom}Z"></path>`;
    };
    let svg = '';
    [0.5, 1].forEach((g) => {
      const gy = y(max * g);
      svg += `<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" class="grid"></line><text x="0" y="${gy - 5}" class="axis">${U.fmtShort(max * g)}</text>`;
    });
    svg += `<line x1="0" x2="${W}" y1="${bottom}" y2="${bottom}" class="base"></line>`;
    months.forEach((m, i) => {
      const cx = gw * i + gw / 2;
      svg += `<g class="grp" data-i="${i}">`;
      svg += bar(cx - bw - 1, m.out, 'bar-out');
      svg += bar(cx + 1, m.in, 'bar-in');
      svg += `<text x="${f1(cx)}" y="${H - 6}" text-anchor="middle" class="axis${i === n - 1 ? ' strong' : ''}">${m.label}</text>`;
      svg += `<rect x="${f1(gw * i)}" y="0" width="${f1(gw)}" height="${H}" fill="transparent" class="hit-g" data-i="${i}"></rect></g>`;
    });
    C.reg[id] = { kind: 'bars', months: months, W: W, gw: gw };
    const last = months[n - 1];
    const label = `Income and spending for the last ${n} months. ${last.label}: spent ${U.fmt(last.out)}, income ${U.fmt(last.in)}.`;
    return `<div class="chart" data-chart-id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${U.esc(label)}" class="chart-svg bar-chart">${svg}</svg><div class="chart-tip" hidden></div></div>`;
  };

  /* ---------- Tooltip wiring ---------- */
  function showTip(wrap, html, xPct) {
    const tip = wrap.querySelector('.chart-tip');
    tip.innerHTML = html;
    tip.hidden = false;
    const w = wrap.clientWidth;
    const tw = tip.offsetWidth;
    let left = (xPct / 100) * w - tw / 2;
    left = Math.max(0, Math.min(w - tw, left));
    tip.style.transform = `translateX(${Math.round(left)}px)`;
  }
  function hideTip(wrap) {
    const tip = wrap.querySelector('.chart-tip');
    if (tip) tip.hidden = true;
  }

  C.mount = (root) => {
    root.querySelectorAll('[data-chart-id]').forEach((wrap) => {
      const d = C.reg[wrap.getAttribute('data-chart-id')];
      if (!d) return;
      const svg = wrap.querySelector('svg');
      if (d.kind === 'line') {
        const fc = d.fc;
        const cross = svg.querySelector('.cross');
        const dot = svg.querySelector('.cross-dot');
        const dot2 = svg.querySelector('.cross-dot2');
        const y = (v) => d.bottom - (v / d.max) * (d.bottom - d.top);
        const move = (ev) => {
          const r = svg.getBoundingClientRect();
          const px = Math.max(0, Math.min(r.width, ev.clientX - r.left));
          const di = Math.round((px / r.width) * (fc.days - 1));
          const X = (di / (fc.days - 1)) * d.W;
          const date = fc.start.slice(0, 8) + String(di + 1).padStart(2, '0');
          const past = !fc.isCurrent || di < fc.dayIdx;
          let val = null;
          let lines = '';
          if (past) {
            val = fc.actual[di];
            lines += `<div class="tip-row"><span class="sw sw-out"></span>Spent <b>${U.fmt(val)}</b></div>`;
          } else if (fc.projSeries) {
            val = fc.projSeries[di - (fc.dayIdx - 1)];
            lines += `<div class="tip-row"><span class="sw sw-proj"></span>Forecast <b>${U.fmt(val)}</b></div>`;
          }
          if (fc.avg) lines += `<div class="tip-row"><span class="sw sw-avg"></span>Usual <b>${U.fmt(fc.avg[di])}</b></div>`;
          cross.setAttribute('x1', X);
          cross.setAttribute('x2', X);
          cross.setAttribute('visibility', 'visible');
          if (val != null) {
            dot.setAttribute('cx', X);
            dot.setAttribute('cy', y(val));
            dot.setAttribute('visibility', 'visible');
          } else dot.setAttribute('visibility', 'hidden');
          if (fc.avg) {
            dot2.setAttribute('cx', X);
            dot2.setAttribute('cy', y(fc.avg[di]));
            dot2.setAttribute('visibility', 'visible');
          }
          showTip(wrap, `<div class="tip-h">${U.fmtDay(date)}</div>${lines}`, (X / d.W) * 100);
        };
        const leave = () => {
          cross.setAttribute('visibility', 'hidden');
          dot.setAttribute('visibility', 'hidden');
          dot2.setAttribute('visibility', 'hidden');
          hideTip(wrap);
        };
        svg.addEventListener('pointermove', move);
        svg.addEventListener('pointerdown', move);
        svg.addEventListener('pointerleave', leave);
        svg.addEventListener('pointercancel', leave);
      } else if (d.kind === 'bars') {
        let sel = -1;
        const pick = (i) => {
          sel = i;
          svg.classList.toggle('has-sel', i >= 0);
          svg.querySelectorAll('.grp').forEach((g) => g.classList.toggle('sel', Number(g.getAttribute('data-i')) === i));
          if (i < 0) return hideTip(wrap);
          const m = d.months[i];
          const net = m.in - m.out;
          showTip(
            wrap,
            `<div class="tip-h">${U.esc(m.full)}</div><div class="tip-row"><span class="sw sw-out"></span>Spent <b>${U.fmt(m.out)}</b></div><div class="tip-row"><span class="sw sw-in"></span>Income <b>${U.fmt(m.in)}</b></div><div class="tip-row muted">Net <b>${U.fmt(net, { plus: true })}</b></div>`,
            ((d.gw * i + d.gw / 2) / d.W) * 100
          );
        };
        svg.addEventListener('pointerover', (ev) => {
          if (ev.pointerType !== 'mouse') return;
          const t = ev.target.closest('.hit-g');
          if (t) pick(Number(t.getAttribute('data-i')));
        });
        svg.addEventListener('pointerleave', (ev) => {
          if (ev.pointerType === 'mouse') pick(-1);
        });
        svg.addEventListener('click', (ev) => {
          const t = ev.target.closest('.hit-g');
          if (!t) return;
          const i = Number(t.getAttribute('data-i'));
          pick(sel === i ? -1 : i);
        });
      }
    });
  };
})();

/* Money Tracker — app shell: routing with real back-button support, view transitions, sheets, toasts, shared components */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const UI = (MT.ui = {
    route: { name: 'home', params: {} },
    sheets: [],
    segFrom: {},
    actions: {},
    views: {},
    hideBalance: false
  });
  const TOP = ['home', 'activity', 'insights', 'more'];
  const $ = (s, r) => (r || document).querySelector(s);
  UI.$ = $;
  UI.TOP = TOP;

  /* ---------- Theme ---------- */
  const hostTheme = MT.PREVIEW ? document.documentElement.getAttribute('data-theme') : null;
  UI.applyTheme = (theme) => {
    const root = document.documentElement;
    if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
    else if (hostTheme) root.setAttribute('data-theme', hostTheme);
    else root.removeAttribute('data-theme');
    requestAnimationFrame(() => {
      const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
        m.setAttribute('content', bg);
        m.removeAttribute('media');
      });
    });
  };

  /* ---------- Rendering ---------- */
  UI.render = (opts) => {
    const o = opts || {};
    const v = UI.views[UI.route.name] || UI.views.home;
    const el = $('#view');
    const y = window.scrollY;
    UI.entering = !!o.entering;
    el.innerHTML = v.render(UI.route.params || {});
    el.setAttribute('data-route', UI.route.name);
    renderTabs();
    if (v.after) v.after(el, UI.route.params || {});
    MT.charts.mount(el);
    animateSegs(el);
    if (o.keepScroll) window.scrollTo(0, y);
    else window.scrollTo(0, 0);
    UI.entering = false;
  };
  UI.refresh = () => {
    if (!MT.store.ready) return;
    UI.render({ keepScroll: true });
    const top = UI.sheets[UI.sheets.length - 1];
    if (top && top.opts.onStoreChange) top.opts.onStoreChange(top.el);
  };

  function viewTransition(fn, dir) {
    if (document.startViewTransition && !U.reducedMotion()) {
      document.documentElement.setAttribute('data-dir', dir || 'fwd');
      try {
        document.startViewTransition(fn);
        return;
      } catch (e) {}
    }
    fn();
  }

  UI.go = (name, params, how) => {
    const route = { name: name, params: params || {} };
    if (how === 'replace') history.replaceState({ route: route }, '');
    else history.pushState({ route: route }, '');
    const dir = TOP.indexOf(name) >= 0 && TOP.indexOf(UI.route.name) >= 0 ? (TOP.indexOf(name) > TOP.indexOf(UI.route.name) ? 'right' : 'left') : 'fwd';
    viewTransition(() => {
      UI.route = route;
      UI.render({ entering: true });
    }, dir);
  };
  UI.back = () => history.back();

  UI.tab = (name) => {
    if (name === UI.route.name) {
      window.scrollTo({ top: 0, behavior: U.reducedMotion() ? 'auto' : 'smooth' });
      return;
    }
    if (name === 'home') {
      if (history.state && history.state.route && history.state.route.name !== 'home' && UI.pushedFromHome) return history.back();
      return UI.go('home', {}, 'replace');
    }
    if (UI.route.name === 'home') {
      UI.pushedFromHome = true;
      UI.go(name, {}, 'push');
    } else UI.go(name, {}, 'replace');
  };

  window.addEventListener('popstate', (e) => {
    if (UI.sheets.length) {
      closeTopSheetDom();
      return;
    }
    const st = e.state;
    if (st && st.route) {
      if (st.route.name === 'home') UI.pushedFromHome = false;
      const from = UI.route.name;
      viewTransition(() => {
        UI.route = st.route;
        UI.render({ entering: true });
      }, TOP.indexOf(from) >= 0 && TOP.indexOf(st.route.name) >= 0 ? 'left' : 'back');
    }
  });

  /* ---------- Tab bar ---------- */
  function renderTabs() {
    const nav = $('#tabs');
    const name = UI.route.name;
    const show = TOP.indexOf(name) >= 0;
    nav.hidden = !show;
    document.body.classList.toggle('has-tabs', show);
    if (!show) return;
    const item = (to, icon, label) =>
      `<button class="tab${name === to ? ' on' : ''}" data-act="tab" data-to="${to}"${name === to ? ' aria-current="page"' : ''}>${U.icon(icon, 22, 1.9)}<span>${label}</span></button>`;
    nav.innerHTML =
      item('home', 'home', 'Home') +
      item('activity', 'list', 'Activity') +
      `<button class="fab press" data-act="quick-add" aria-label="Add transaction">${U.icon('plus', 26, 2.2)}</button>` +
      item('insights', 'insights', 'Insights') +
      item('more', 'more', 'More');
  }

  /* ---------- Segmented controls: animate the pill between re-renders ---------- */
  UI.seg = (key, options, current, act, extra) => {
    const i = Math.max(0, options.findIndex((o) => o.id === current));
    return (
      `<div class="seg${extra ? ' ' + extra : ''}" role="group" aria-label="${U.esc(key)}" data-seg="${U.esc(key)}" style="--n:${options.length};--i:${i}"><span class="seg-pill" aria-hidden="true"></span>` +
      options
        .map(
          (o, j) =>
            `<button type="button" data-act="${act}" data-val="${U.esc(o.id)}" data-seg-i="${j}" data-seg-key="${U.esc(key)}" aria-pressed="${o.id === current}">${o.icon ? U.icon(o.icon, 16, 2) : ''}${U.esc(o.label)}</button>`
        )
        .join('') +
      `</div>`
    );
  };
  UI.noteSeg = (el) => {
    const key = el.getAttribute('data-seg-key');
    const wrap = el.closest('[data-seg]');
    if (key && wrap) UI.segFrom[key] = Number(getComputedStyle(wrap).getPropertyValue('--i')) || 0;
  };
  function animateSegs(root) {
    root.querySelectorAll('[data-seg]').forEach((w) => {
      const key = w.getAttribute('data-seg');
      if (!(key in UI.segFrom)) return;
      const from = UI.segFrom[key];
      delete UI.segFrom[key];
      const to = w.style.getPropertyValue('--i');
      if (String(from) === String(to)) return;
      const pill = w.querySelector('.seg-pill');
      pill.style.transition = 'none';
      w.style.setProperty('--i', from);
      void pill.offsetWidth;
      pill.style.transition = '';
      w.style.setProperty('--i', to);
    });
  }
  UI.animateSegs = animateSegs;
  /* move a segmented control in place without re-rendering */
  UI.setSeg = (wrap, index) => {
    if (!wrap) return;
    delete UI.segFrom[wrap.getAttribute('data-seg')];
    wrap.style.setProperty('--i', index);
    wrap.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-pressed', String(j === index)));
  };

  /* ---------- Small components ---------- */
  UI.tile = (cat, size) =>
    `<span class="tile c-${U.esc(cat.color || 'slate')}${size ? ' tile-' + size : ''}">${U.icon(cat.icon, size === 'sm' ? 18 : size === 'lg' ? 24 : 20)}</span>`;
  UI.switch = (id, on, act, labelledby) =>
    `<button type="button" class="switch" role="switch" id="${id}" aria-checked="${on ? 'true' : 'false'}" data-act="${act}"${labelledby ? ` aria-labelledby="${labelledby}"` : ''}><span class="knob" aria-hidden="true"></span></button>`;
  UI.subHeader = (title, right) =>
    `<header class="subhead appbar"><button class="icon-btn" data-act="back" aria-label="Back">${U.icon('back', 22, 2)}</button><h1>${U.esc(title)}</h1><div class="subhead-r">${right || ''}</div></header>`;
  UI.empty = (icon, title, body, actionHtml) =>
    `<div class="empty">${U.icon(icon, 28, 1.6)}<p class="empty-t">${U.esc(title)}</p><p class="empty-b">${U.esc(body)}</p>${actionHtml || ''}</div>`;
  UI.amountClass = (t) => (t.type === 'income' ? 'amt in' : 'amt');
  UI.txRow = (t, opts) => {
    const o = opts || {};
    const S = MT.store;
    const c = S.cat(t.categoryId);
    const title = t.name || c.name;
    const sub = [];
    if (t.name) sub.push(c.name);
    if (o.showDate) sub.push(U.fmtDay(t.date));
    if (t.recurringId) sub.push('Recurring');
    if (t.excluded) sub.push('Not in reports');
    return `<button class="tx-row press" data-act="edit-tx" data-id="${U.esc(t.id)}">${UI.tile(c)}<span class="tx-main"><span class="tx-title">${o.titleHtml || U.esc(title)}</span>${sub.length ? `<span class="tx-sub">${U.esc(sub.join(' · '))}</span>` : ''}${o.noteHtml || ''}</span><span class="${UI.amountClass(t)}">${U.fmtSigned(t)}</span></button>`;
  };

  /* ---------- Sheets (bottom sheets that respect the Android back button) ---------- */
  UI.openSheet = (opts) => {
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = `<div class="scrim" data-act="sheet-close"></div><section class="sheet${opts.full ? ' full' : ''}${opts.cls ? ' ' + opts.cls : ''}" role="dialog" aria-modal="true" aria-label="${U.esc(opts.label || 'Panel')}"><div class="grab" aria-hidden="true"></div><div class="sheet-body"></div></section>`;
    const body = wrap.querySelector('.sheet-body');
    body.innerHTML = opts.render();
    $('#layer').appendChild(wrap);
    const entry = { el: wrap, opts: opts };
    UI.sheets.push(entry);
    document.body.classList.add('locked');
    history.pushState({ route: UI.route, sheet: true }, '');
    if (opts.after) opts.after(wrap.querySelector('.sheet'));
    MT.charts.mount(wrap);
    animateSegs(wrap);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => wrap.classList.add('open'));
    });
    const focusEl = wrap.querySelector('[autofocus]') || wrap.querySelector('.sheet');
    setTimeout(() => {
      try {
        focusEl.focus({ preventScroll: true });
      } catch (e) {}
    }, 60);
    return entry;
  };
  UI.rerenderSheet = (entry) => {
    const body = entry.el.querySelector('.sheet-body');
    body.innerHTML = entry.opts.render();
    if (entry.opts.after) entry.opts.after(entry.el.querySelector('.sheet'));
    MT.charts.mount(entry.el);
    animateSegs(entry.el);
  };
  let closeResolvers = [];
  function closeTopSheetDom() {
    const entry = UI.sheets.pop();
    if (!entry) return;
    entry.el.classList.remove('open');
    entry.el.classList.add('closing');
    if (entry.opts.onClose) {
      try {
        entry.opts.onClose();
      } catch (e) {}
    }
    setTimeout(() => entry.el.remove(), U.reducedMotion() ? 0 : 280);
    if (!UI.sheets.length) document.body.classList.remove('locked');
    const r = closeResolvers;
    closeResolvers = [];
    r.forEach((fn) => fn());
  }
  UI.closeSheet = () =>
    new Promise((resolve) => {
      if (!UI.sheets.length) return resolve();
      closeResolvers.push(resolve);
      history.back();
    });
  UI.topSheet = () => UI.sheets[UI.sheets.length - 1];

  /* ---------- Toast ---------- */
  let toastTimer = null;
  UI.toast = (msg, opts) => {
    const o = opts || {};
    const root = $('#toast-root');
    clearTimeout(toastTimer);
    root.innerHTML = `<div class="toast${o.kind === 'error' ? ' error' : ''}" role="status">${o.kind === 'error' ? U.icon('alert', 18, 2) : U.icon('check', 18, 2.4)}<span class="toast-msg">${U.esc(msg)}</span>${o.action ? `<button class="toast-btn" data-act="toast-action">${U.esc(o.action)}</button>` : ''}</div>`;
    UI._toastAction = o.onAction || null;
    requestAnimationFrame(() => root.firstChild && root.firstChild.classList.add('show'));
    toastTimer = setTimeout(UI.hideToast, o.duration || (o.action ? 5000 : 2600));
  };
  UI.hideToast = () => {
    const t = $('#toast-root').firstChild;
    if (!t) return;
    t.classList.remove('show');
    setTimeout(() => t.remove(), 250);
    UI._toastAction = null;
  };
  UI.actions['toast-action'] = () => {
    const fn = UI._toastAction;
    UI.hideToast();
    if (fn) fn();
  };
  UI.error = (e) => UI.toast((e && e.message) || 'Something went wrong. Nothing was changed.', { kind: 'error', duration: 4000 });

  /* ---------- Confirm (in-page, since dialogs are blocked in some contexts) ---------- */
  UI.confirm = (o) =>
    new Promise((resolve) => {
      let answered = false;
      UI.openSheet({
        label: o.title,
        cls: 'confirm',
        render: () =>
          `<h2 class="sheet-title">${U.esc(o.title)}</h2>${o.body ? `<p class="sheet-text">${o.body}</p>` : ''}<div class="btn-row"><button class="btn" data-act="confirm-no">Cancel</button><button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" data-act="confirm-yes">${U.esc(o.ok || 'Confirm')}</button></div>`,
        after: (sheet) => {
          sheet.querySelector('[data-act="confirm-yes"]').onclick = (e) => {
            e.stopPropagation();
            answered = true;
            UI.closeSheet().then(() => resolve(true));
          };
          sheet.querySelector('[data-act="confirm-no"]').onclick = (e) => {
            e.stopPropagation();
            UI.closeSheet();
          };
        },
        onClose: () => {
          if (!answered) resolve(false);
        }
      });
    });

  /* ---------- Global event delegation ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = UI.actions[el.getAttribute('data-act')];
    if (!fn) return;
    e.preventDefault();
    if (el.hasAttribute('data-seg-key')) UI.noteSeg(el);
    fn(el, e);
  });
  UI.actions.tab = (el) => UI.tab(el.getAttribute('data-to'));
  UI.actions.back = () => UI.back();
  UI.actions.go = (el) => {
    let params = {};
    try {
      params = JSON.parse(el.getAttribute('data-params') || '{}');
    } catch (e) {}
    UI.go(el.getAttribute('data-to'), params);
  };
  UI.actions['sheet-close'] = () => UI.closeSheet();
})();

/* Money Tracker — screens */
(function () {
  'use strict';
  const MT = window.MT;
  const U = MT.util;
  const S = MT.store;
  const X = MT.smart;
  const UI = MT.ui;
  const V = UI.views;
  const A = UI.actions;
  const esc = U.esc;
  const ic = U.icon;

  UI.act = { period: 'month', anchor: U.today(), cat: null };
  UI.homePeriod = 'month';
  UI.insMonth = U.monthStart(U.today());

  /* ================= HOME ================= */
  V.home = {
    render() {
      const today = U.today();
      const fc = X.forecast(today);
      const tot = S.totals(U.monthStart(today), today);
      const d = U.parse(today);
      let h = `<header class="appbar topbar"><div><p class="eyebrow">${U.dowLong(today)} ${d.getDate()} ${U.MONL[d.getMonth()]}</p><h1 class="h1">Overview</h1></div><button class="icon-btn outline press" data-act="go" data-to="search" aria-label="Search transactions">${ic('search', 20, 1.9)}</button></header>`;
      h += `<div class="stack">`;
      if (MT.db.memory) h += `<div class="banner warn">${ic('alert', 18, 2)}<p><b>Preview mode.</b> Storage isn’t available here, so anything you add disappears when you close this page.</p></div>`;
      if (S.hasExamples()) h += `<div class="banner">${ic('spark', 18, 2)}<p>You’re looking at <b>example data</b>. Remove it before you start logging for real.</p><button class="btn btn-sm btn-soft press" data-act="clear-examples">Remove</button></div>`;
      const last = S.meta.lastFileBackup;
      if (!MT.db.memory && S.tx.some((t) => !t.example) && (!last || Date.now() - last > 3 * 86400000)) {
        h += `<div class="banner">${ic('shield', 18, 2)}<p>${last ? 'Your last backup file was ' + U.ago(last) + '.' : 'You haven’t saved a backup file yet.'} Save one so nothing can be lost.</p><button class="btn btn-sm btn-primary press" data-act="backup-now">Back up</button></div>`;
      }
      /* balance */
      const hidden = UI.hideBalance;
      h += `<section class="hero"><div class="hero-top"><span class="hero-label">Total balance</span><button class="hero-eye press" data-act="toggle-balance" aria-pressed="${hidden}" aria-label="${hidden ? 'Show balance' : 'Hide balance'}">${ic(hidden ? 'eyeOff' : 'eye', 20, 1.9)}</button></div><div class="hero-amt${hidden ? ' masked' : ''}" aria-live="polite">${hidden ? '£ ••••••' : U.fmt(S.balance())}</div><div class="hero-bottom"><span class="hero-sub">${ic('wallet', 16, 1.9)} ${S.tx.length ? S.tx.length.toLocaleString('en-GB') + ' transaction' + (S.tx.length === 1 ? '' : 's') : 'No transactions yet'}</span><button class="hero-btn press" data-act="go" data-to="adjust">${ic('sliders', 16, 1.9)} Adjust</button></div></section>`;
      if (!S.tx.length) {
        h += `<section class="card welcome"><h2 class="card-title">Log your first expense</h2><p class="muted">Tap the + button any time. Type “coffee 3.40” in the description and the amount, date and category fill themselves in.</p><button class="btn btn-primary press" data-act="quick-add">${ic('plus', 18, 2.2)} Add a transaction</button></section>`;
      }
      /* watchdog alerts */
      X.alerts().forEach((a) => {
        h += `<div class="alert ${a.kind}" data-alert="${esc(a.id)}"><span class="alert-ic">${ic(a.icon, 18, 2)}</span><button class="alert-main" data-act="edit-tx" data-id="${esc(a.txId)}"><b>${esc(a.title)}</b><span>${esc(a.body)}</span></button><button class="icon-btn sm" data-act="dismiss-alert" data-id="${esc(a.id)}" aria-label="Dismiss">${ic('close', 16, 2)}</button></div>`;
      });
      /* month card */
      h += `<section class="card"><div class="card-head"><h2 class="card-title">${U.MONL[d.getMonth()]} so far</h2><span class="muted sm">Day ${fc.dayIdx} of ${fc.days}</span></div>`;
      h += `<div class="pair"><div><span class="lbl">Spent</span><span class="big">${U.fmt(tot.out)}</span></div><div><span class="lbl">Income</span><span class="big in">${U.fmt(tot.in, { plus: true })}</span></div></div>`;
      h += pacePill(fc);
      if (S.tx.length) {
        h += MT.charts.monthLine(fc, { animate: UI.entering });
        h += lineLegend(fc);
      }
      h += `<button class="link-row press" data-act="tab" data-to="insights">See insights ${ic('chevR', 16, 2)}</button></section>`;
      /* top spending */
      const p = UI.homePeriod;
      const from = p === 'week' ? U.weekStart(today, S.settings().weekStart) : U.monthStart(today);
      const cats = S.byCategory(from, today, 'expense');
      const totalOut = cats.reduce((a, c) => a + c.total, 0);
      h += `<section class="card"><div class="card-head"><h2 class="card-title">Top spending</h2>${UI.seg('home-period', [{ id: 'week', label: 'Week' }, { id: 'month', label: 'Month' }], p, 'home-period', 'seg-sm')}</div>`;
      if (cats.length) {
        h += `<div class="cat-bars">` + cats.slice(0, 4).map((c) => catBar(c, totalOut, cats[0].total, from, today)).join('') + `</div>`;
      } else h += `<p class="muted pad-t">Nothing spent ${p === 'week' ? 'this week' : 'this month'} yet.</p>`;
      h += `</section>`;
      /* coming up */
      const up = S.upcoming(10).slice(0, 3);
      if (up.length) {
        h += `<section class="card list-card"><div class="card-head"><h2 class="card-title">Coming up</h2><button class="link press" data-act="go" data-to="recurring">All recurring</button></div>`;
        h += up
          .map((u) => {
            const c = S.cat(u.rule.categoryId);
            return `<button class="tx-row press" data-act="edit-rec" data-id="${esc(u.rule.id)}">${UI.tile(c)}<span class="tx-main"><span class="tx-title">${esc(u.rule.name)}</span><span class="tx-sub">${esc(U.fmtDay(u.date))} · logged automatically</span></span><span class="${u.rule.type === 'income' ? 'amt in' : 'amt'}">${u.rule.type === 'income' ? '+' : '−'}${U.fmt(u.rule.amount)}</span></button>`;
          })
          .join('');
        h += `</section>`;
      }
      /* recent */
      if (S.tx.length) {
        h += `<section class="card list-card"><div class="card-head"><h2 class="card-title">Recent</h2><button class="link press" data-act="see-all">See all</button></div>`;
        h += S.tx.slice(0, 5).map((t) => UI.txRow(t, { showDate: true })).join('');
        h += `</section>`;
      }
      h += `</div>`;
      return h;
    }
  };

  function pacePill(fc) {
    if (fc.avgToDate != null && fc.dayIdx) {
      const diff = fc.avgToDate - fc.spent;
      if (diff >= 0) return `<p class="pill good">${ic('down', 14, 2.2)} ${U.fmt(diff)} under your usual pace</p>`;
      return `<p class="pill warn">${ic('up', 14, 2.2)} ${U.fmt(-diff)} over your usual pace</p>`;
    }
    if (fc.projection) return `<p class="pill">${ic('spark', 14, 2)} Heading for about ${U.fmt(fc.projection)} this month</p>`;
    return '';
  }
  function lineLegend(fc) {
    let l = `<div class="legend"><span><i class="sw sw-out"></i>This month · ${U.fmt(fc.spent)}</span>`;
    if (fc.avg) l += `<span><i class="sw sw-avg"></i>${fc.avgMonths}-month average${fc.avgToDate != null ? ' · ' + U.fmt(fc.avgToDate) : ''}</span>`;
    if (fc.projection) l += `<span><i class="sw sw-proj"></i>Forecast · ${U.fmt(fc.projection)}</span>`;
    return l + `</div>`;
  }
  function catBar(c, total, max, from, to) {
    const pct = total ? Math.round((c.total / total) * 100) : 0;
    const w = max ? Math.max(2, Math.round((c.total / max) * 100)) : 0;
    return `<button class="cat-bar press" data-act="cat-activity" data-cat="${esc(c.cat.id)}" data-from="${from}" data-to="${to}">${UI.tile(c.cat)}<span class="cb-main"><span class="cb-top"><span class="cb-name">${esc(c.cat.name)}</span><span class="cb-amt">${U.fmt(c.total)}</span></span><span class="cb-track"><span class="cb-fill" style="width:${w}%"></span></span></span><span class="cb-pct">${pct}%</span></button>`;
  }

  A['toggle-balance'] = () => {
    UI.hideBalance = !UI.hideBalance;
    const hero = document.querySelector('.hero');

  /* ================= ACTIVITY ================= */
  function rangeOf(period, anchor) {
    const ws = S.settings().weekStart;
    if (period === 'day') return { from: anchor, to: anchor, label: U.fmtDay(anchor) };
    if (period === 'week') {
      const from = U.weekStart(anchor, ws);
      const to = U.addDays(from, 6);
      const f = U.parse(from);
      const t = U.parse(to);
      const label = f.getMonth() === t.getMonth() ? `${f.getDate()} – ${t.getDate()} ${U.MON[t.getMonth()]}` : `${f.getDate()} ${U.MON[f.getMonth()]} – ${t.getDate()} ${U.MON[t.getMonth()]}`;
      return { from: from, to: to, label: label };
    }
    return { from: U.monthStart(anchor), to: U.monthEnd(anchor), label: U.fmtMonth(anchor) };
  }
  UI.rangeOf = rangeOf;
  V.activity = {
    render() {
      const st = UI.act;
      const r = rangeOf(st.period, st.anchor);
      const today = U.today();
      const canNext = r.to < today;
      let h = `<header class="appbar topbar"><h1 class="h1">Activity</h1><button class="icon-btn outline press" data-act="go" data-to="search" aria-label="Search transactions">${ic('search', 20, 1.9)}</button></header><div class="stack">`;
      h += UI.seg('Period', [{ id: 'day', label: 'Day' }, { id: 'week', label: 'Week' }, { id: 'month', label: 'Month' }], st.period, 'act-period');
      h += `<div class="range-nav"><button class="icon-btn press" data-act="act-step" data-dir="-1" aria-label="Previous">${ic('chevL', 20, 2)}</button><span class="range-label">${esc(r.label)}</span><button class="icon-btn press" data-act="act-step" data-dir="1" aria-label="Next"${canNext ? '' : ' disabled'}>${ic('chevR', 20, 2)}</button></div>`;
      const all = S.range(r.from, r.to);
      const tot = S.totals(r.from, r.to);
      h += `<section class="card summary3"><div><span class="lbl">Money in</span><span class="mid in">${U.fmt(tot.in, { plus: true })}</span></div><div><span class="lbl">Money out</span><span class="mid">${U.fmt(-tot.out)}</span></div><div class="r"><span class="lbl">Net</span><span class="mid">${U.fmt(tot.net, { plus: true })}</span></div></section>`;
      /* category filter */
      const present = {};
      all.forEach((t) => (present[t.categoryId] = (present[t.categoryId] || 0) + t.amount));
      const ids = Object.keys(present).sort((a, b) => present[b] - present[a]);
      if (st.cat && ids.indexOf(st.cat) < 0) ids.unshift(st.cat);
      if (ids.length > 1 || st.cat) {
        h += `<div class="chips scroll-x" role="group" aria-label="Filter by category"><button class="chip${!st.cat ? ' on' : ''}" data-act="act-cat" data-cat="" aria-pressed="${!st.cat}">All</button>`;
        h += ids.map((id) => `<button class="chip${st.cat === id ? ' on' : ''}" data-act="act-cat" data-cat="${esc(id)}" aria-pressed="${st.cat === id}">${esc(S.cat(id).name)}</button>`).join('');
        h += `</div>`;
      }
      const list = st.cat ? all.filter((t) => t.categoryId === st.cat) : all;
      if (!list.length) {
        h += UI.empty('list', st.cat ? 'Nothing in ' + S.cat(st.cat).name : 'Nothing logged', st.period === 'day' ? 'No transactions on this day.' : 'No transactions in this period.', `<button class="btn btn-primary press" data-act="quick-add" data-date="${st.period === 'day' ? st.anchor : ''}">${ic('plus', 18, 2.2)} Add one</button>`);
      } else {
        const groups = [];
        list.forEach((t) => {
          let g = groups[groups.length - 1];
          if (!g || g.date !== t.date) groups.push((g = { date: t.date, items: [] }));
          g.items.push(t);
        });
        h += groups
          .map((g) => {
            const net = g.items.reduce((a, t) => a + S.signed(t), 0);
            const dd = U.parse(g.date);
            const dayName = g.date === today ? 'Today' : g.date === U.addDays(today, -1) ? 'Yesterday' : U.dowLong(g.date);
            return `<section class="card day-group"><div class="day-head"><span class="day-num">${dd.getDate()}</span><span class="day-meta"><b>${dayName}</b><span>${U.MONL[dd.getMonth()]} ${dd.getFullYear()}</span></span><span class="day-net">${U.fmt(net, { plus: true })}</span></div>${g.items.map((t) => UI.txRow(t)).join('')}</section>`;
          })
          .join('');
      }
      h += `</div>`;
      return h;
    }

      h += `<div class="stack"><div class="chips" role="group" aria-label="Type">${[['all', 'All'], ['expense', 'Expenses'], ['income', 'Income']].map((o) => `<button class="chip${UI.search.type === o[0] ? ' on' : ''}" data-act="search-type" data-val="${o[0]}" aria-pressed="${UI.search.type === o[0]}">${o[1]}</button>`).join('')}</div><div id="search-results"></div></div>`;

  function mark(text, needle) {
    const t = String(text || '');
    if (!needle) return esc(t);
    const i = t.toLowerCase().indexOf(needle);
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + needle.length)) + '</mark>' + esc(t.slice(i + needle.length));
  }
  function searchResults() {
    const q = UI.search.q.trim().toLowerCase();
    const type = UI.search.type;
    if (!q) {
      const rec = S.meta.recentSearches || [];
      let h = '';
      if (rec.length) h += `<h2 class="section-label">Recent searches</h2><div class="chips wrap">${rec.map((r) => `<button class="chip" data-act="search-recent" data-q="${esc(r)}">${ic('history', 14, 2)} ${esc(r)}</button>`).join('')}</div>`;
      h += `<p class="muted pad-t">Results appear as you type. Part of a word is enough, and notes, categories and amounts are searched too.</p>`;
      return h;
    }
    const qMoney = q.replace(/[£,]/g, '');
    const res = S.tx.filter((t) => {
      if (type !== 'all' && t.type !== type) return false;
      const c = S.cat(t.categoryId).name.toLowerCase();
      const amt = (t.amount / 100).toFixed(2);
      return (t.name || '').toLowerCase().indexOf(q) >= 0 || (t.note || '').toLowerCase().indexOf(q) >= 0 || c.indexOf(q) >= 0 || (qMoney && /^[\d.]+$/.test(qMoney) && amt.indexOf(qMoney) === 0);
    });
    if (!res.length) return UI.empty('search', 'No matches', 'Try fewer letters, or check the Expenses / Income filter.');
    const total = res.reduce((a, t) => a + S.signed(t), 0);
    let h = `<div class="res-head"><span>${res.length} result${res.length === 1 ? '' : 's'}</span><span>${U.fmt(total, { plus: true })}</span></div><section class="card list-card">`;
    h += res
      .slice(0, 150)
      .map((t) => {
        const c = S.cat(t.categoryId);
        const title = t.name || c.name;
        const noteHit = t.note && t.note.toLowerCase().indexOf(q) >= 0;
        return UI.txRow(t, { showDate: true, titleHtml: mark(title, q), noteHtml: noteHit ? `<span class="tx-note">“${mark(t.note, q)}”</span>` : '' });
      })
      .join('');
    h += `</section>`;
    if (res.length > 150) h += `<p class="muted sm pad-t">Showing the latest 150. Add more letters to narrow it down.</p>`;
    return h;
  }
  function rememberSearch(q) {
    q = String(q || '').trim();

      const isCurrent = m === U.monthStart(today);

        h += UI.empty('insights', 'Charts appear as you log', 'Once you’ve added a few transactions, this is where you’ll see where your money goes.', `<button class="btn btn-primary press" data-act="quick-add">${ic('plus', 18, 2.2)} Add a transaction</button>`);
        return h + '</div>';
      }
      /* headline */
      h += `<section class="card">`;
      if (isCurrent && fc.projection) {
        h += `<p class="lbl">Forecast for ${U.MONL[U.parse(m).getMonth()]}</p><p class="headline">${U.fmt(fc.projection)}</p><p class="muted">You’ve spent ${U.fmt(fc.spent)} so far${fc.avg ? `. A typical month ends around ${U.fmt(fc.avg[fc.days - 1])}` : ''}.</p>`;
      } else {
        h += `<p class="lbl">Spent in ${U.MONL[U.parse(m).getMonth()]}${isCurrent ? ' so far' : ''}</p><p class="headline">${U.fmt(tot.out)}</p>${fc.avg && !isCurrent ? `<p class="muted">Your ${fc.avgMonths}-month average before this was ${U.fmt(fc.avg[fc.days - 1])}.</p>` : ''}`;
      }
      h += MT.charts.monthLine(fc, { animate: UI.entering }) + lineLegend(fc) + `</section>`;
      /* stat tiles */
      const daily = S.dailySpend(m, end);
      const dayCount = Math.max(1, U.daysBetween(m, end) + 1);
      let bigDay = null;
      Object.keys(daily).forEach((k) => {
        if (!bigDay || daily[k] > daily[bigDay]) bigDay = k;
      });

      const go = `<span class="stat-go" aria-hidden="true">${ic('chevR', 14, 2.2)}</span>`;
      h += `<div class="tiles3">`;

      h += bigDay
        ? `<button class="stat press" data-act="stat-go" data-period="day" data-anchor="${bigDay}" aria-label="Biggest day ${U.fmt(daily[bigDay])} on ${U.fmtDay(bigDay)}. Open that day">${go}<span class="lbl">Biggest day</span><span class="mid">${U.fmt(daily[bigDay])}</span><span class="tiny">${U.fmtShortDate(bigDay)}</span></button>`
        : `<div class="stat"><span class="lbl">Biggest day</span><span class="mid">£0.00</span><span class="tiny">—</span></div>`;
      h += `<button class="stat press" data-act="stat-go" data-period="month" data-anchor="${end}" aria-label="${count} entries. Open all entries for the month">${go}<span class="lbl">Entries</span><span class="mid">${count}</span><span class="tiny">See all</span></button>`;
      h += `</div>`;
      /* categories */
      const cats = S.byCategory(m, end, 'expense');
      h += `<section class="card"><div class="card-head"><h2 class="card-title">Where it went</h2><span class="muted sm">${U.fmt(tot.out)}</span></div>`;
      if (cats.length) {

        h += `<div class="cat-bars">` + top.map((c) => catBar(c, tot.out, cats[0].total, m, end)).join('');
        if (rest.length) {
          const r = { cat: { id: '', name: rest.length + ' more categories', icon: 'more', color: 'slate' }, total: rest.reduce((a, c) => a + c.total, 0) };
          const pct = Math.round((r.total / tot.out) * 100);
          h += `<div class="cat-bar static">${UI.tile(r.cat)}<span class="cb-main"><span class="cb-top"><span class="cb-name">${esc(r.cat.name)}</span><span class="cb-amt">${U.fmt(r.total)}</span></span><span class="cb-track"><span class="cb-fill muted-fill" style="width:${Math.max(2, Math.round((r.total / cats[0].total) * 100))}%"></span></span></span><span class="cb-pct">${pct}%</span></div>`;
        }
        h += `</div>`;
      } else h += `<p class="muted pad-t">No spending this month.</p>`;
      const inc = S.byCategory(m, end, 'income');
      if (inc.length) h += `<p class="muted sm pad-t">Income: ${inc.slice(0, 3).map((c) => esc(c.cat.name) + ' ' + U.fmt(c.total)).join(' · ')}</p>`;

      h += `</div>`;
      return h;
    }
  };
