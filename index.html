<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private, offline money tracker. Your data stays on your phone.">
<meta name="theme-color" content="#F4F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E14" media="(prefers-color-scheme: dark)">
<title>Money Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
/* Money Tracker
   Layout: single-column phone app, 20px gutter, white cards on a cool grey ground, royal blue accent, bottom tab bar with a raised add button.
   Type: Manrope throughout, tabular figures for every amount. */
:root {
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.22, .9, .24, 1);
  --ease-soft: cubic-bezier(.4, 0, .2, 1);

  --bg: #F4F5F9;
  --surface: #FFFFFF;
  --surface-2: #F4F5F9;
  --line: #E4E6EE;
  --divider: #EEF0F5;
  --ink: #0E1324;
  --muted: #5B6275;
  --faint: #8A91A3;
  --accent: #2F55D4;
  --accent-ink: #2F55D4;
  --accent-press: #2443AE;
  --accent-soft: #E9EEFC;
  --on-accent: #FFFFFF;
  --hero: #2F55D4;
  --hero-chip: rgba(255, 255, 255, .15);
  --good: #1E7F55;
  --good-soft: #E3F4EC;
  --bad: #C2364A;
  --bad-soft: #FBE5E7;
  --warn: #8A6410;
  --warn-soft: #FBF1D6;
  --seg: #E9EBF2;
  --seg-pill: #FFFFFF;
  --switch-off: #CDD2DE;
  --nav: rgba(255, 255, 255, .92);
  --scrim: rgba(14, 19, 36, .45);
  --toast: #0E1324;
  --toast-ink: #FFFFFF;
  --toast-action: #B9C9FF;
  --tip: #0E1324;
  --tip-ink: #FFFFFF;
  --shadow-sm: 0 1px 2px rgba(14, 19, 36, .06);
  --shadow-lg: 0 12px 32px rgba(14, 19, 36, .14);
  --fab-shadow: 0 10px 24px rgba(47, 85, 212, .35);
  --mark: #DCE4FB;

  --chart-grid: #E4E6EE;
  --chart-avg: #8A91A3;
  --chart-out: #2F55D4;
  --chart-in: #1E7F55;
  
  --c-blue-bg: #E9EEFC; --c-blue-fg: #2F55D4;
  --c-indigo-bg: #E6E8FB; --c-indigo-fg: #4A50C4;
  --c-purple-bg: #EFE8FB; --c-purple-fg: #6B45C2;
  --c-teal-bg: #DDF3F2; --c-teal-fg: #12766F;
  --c-green-bg: #E3F4EC; --c-green-fg: #1E7F55;
  --c-sky-bg: #DFF0FB; --c-sky-fg: #1F6FA3;
  --c-amber-bg: #FBF1D6; --c-amber-fg: #8A6410;
  --c-orange-bg: #FDEBDD; --c-orange-fg: #B4551B;
  --c-red-bg: #FBE5E7; --c-red-fg: #B83242;
  --c-pink-bg: #FBE6EF; --c-pink-fg: #B02F68;
  --c-slate-bg: #E9ECF1; --c-slate-fg: #465066;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E14; --surface: #161922; --surface-2: #1E2230; --line: #262B38; --divider: #222634;
    --ink: #F2F4FA; --muted: #9AA1B5; --faint: #6B7285;
    --accent: #3B63E6; --accent-ink: #9DB4FF; --accent-press: #2F55D4; --accent-soft: rgba(124, 155, 255, .15); --on-accent: #FFFFFF;
    --hero: #3B63E6; --hero-chip: rgba(255, 255, 255, .14);
    --good: #4FD69C; --good-soft: rgba(79, 214, 156, .14); --bad: #FF7A8A; --bad-soft: rgba(255, 122, 138, .14); --warn: #F0C766; --warn-soft: rgba(240, 199, 102, .14);
    --seg: #0C0E14; --seg-pill: #2A3042; --switch-off: #3A4050; --nav: rgba(18, 20, 27, .92);
    --scrim: rgba(0, 0, 0, .6); --toast: #F2F4FA; --toast-ink: #0E1324; --toast-action: #2F55D4; --tip: #F2F4FA; --tip-ink: #0E1324;
    --shadow-sm: none; --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5); --fab-shadow: 0 10px 24px rgba(59, 99, 230, .4); --mark: rgba(124, 155, 255, .32);
    --chart-grid: #262B38; --chart-avg: #6B7285; --chart-out: #6B8CF5; --chart-in: #2FAE78;
    --c-blue-bg: rgba(124, 155, 255, .16); --c-blue-fg: #9DB4FF;
    --c-indigo-bg: rgba(150, 156, 255, .16); --c-indigo-fg: #ADB1FF;
    --c-purple-bg: rgba(181, 148, 255, .16); --c-purple-fg: #C3A8FF;
    --c-teal-bg: rgba(94, 211, 200, .14); --c-teal-fg: #5ED3C8;
    --c-green-bg: rgba(79, 214, 156, .14); --c-green-fg: #4FD69C;
    --c-sky-bg: rgba(124, 196, 242, .15); --c-sky-fg: #7CC4F2;
    --c-amber-bg: rgba(240, 199, 102, .14); --c-amber-fg: #F0C766;
    --c-orange-bg: rgba(255, 176, 122, .14); --c-orange-fg: #FFB07A;
    --c-red-bg: rgba(255, 143, 156, .14); --c-red-fg: #FF8F9C;
    --c-pink-bg: rgba(255, 157, 198, .14); --c-pink-fg: #FF9DC6;
    --c-slate-bg: rgba(179, 186, 203, .13); --c-slate-fg: #B3BACB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0E14; --surface: #161922; --surface-2: #1E2230; --line: #262B38; --divider: #222634;
  --ink: #F2F4FA; --muted: #9AA1B5; --faint: #6B7285;
  --accent: #3B63E6; --accent-ink: #9DB4FF; --accent-press: #2F55D4; --accent-soft: rgba(124, 155, 255, .15); --on-accent: #FFFFFF;
  --hero: #3B63E6; --hero-chip: rgba(255, 255, 255, .14);
  --good: #4FD69C; --good-soft: rgba(79, 214, 156, .14); --bad: #FF7A8A; --bad-soft: rgba(255, 122, 138, .14); --warn: #F0C766; --warn-soft: rgba(240, 199, 102, .14);
  --seg: #0C0E14; --seg-pill: #2A3042; --switch-off: #3A4050; --nav: rgba(18, 20, 27, .92);
  --scrim: rgba(0, 0, 0, .6); --toast: #F2F4FA; --toast-ink: #0E1324; --toast-action: #2F55D4; --tip: #F2F4FA; --tip-ink: #0E1324;
  --shadow-sm: none; --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5); --fab-shadow: 0 10px 24px rgba(59, 99, 230, .4); --mark: rgba(124, 155, 255, .32);
  --chart-grid: #262B38; --chart-avg: #6B7285; --chart-out: #6B8CF5; --chart-in: #2FAE78;
  --c-blue-bg: rgba(124, 155, 255, .16); --c-blue-fg: #9DB4FF;
  --c-indigo-bg: rgba(150, 156, 255, .16); --c-indigo-fg: #ADB1FF;
  --c-purple-bg: rgba(181, 148, 255, .16); --c-purple-fg: #C3A8FF;
  --c-teal-bg: rgba(94, 211, 200, .14); --c-teal-fg: #5ED3C8;
  --c-green-bg: rgba(79, 214, 156, .14); --c-green-fg: #4FD69C;
  --c-sky-bg: rgba(124, 196, 242, .15); --c-sky-fg: #7CC4F2;
  --c-amber-bg: rgba(240, 199, 102, .14); --c-amber-fg: #F0C766;
  --c-orange-bg: rgba(255, 176, 122, .14); --c-orange-fg: #FFB07A;
  --c-red-bg: rgba(255, 143, 156, .14); --c-red-fg: #FF8F9C;
  --c-pink-bg: rgba(255, 157, 198, .14); --c-pink-fg: #FF9DC6;
  --c-slate-bg: rgba(179, 186, 203, .13); --c-slate-fg: #B3BACB;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
html.theming, html.theming * { transition: background-color .4s var(--ease-soft), color .4s var(--ease-soft), border-color .4s var(--ease-soft), fill .4s, stroke .4s !important; }
body.locked { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2.5px solid var(--accent-ink); outline-offset: 2px; border-radius: 10px; }
.ic { flex: none; display: block; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 1px; }
[hidden] { display: none !important; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
#view { padding: 0 max(20px, env(safe-area-inset-left, 0px)) 40px max(20px, env(safe-area-inset-right, 0px)); outline: none; }
body.has-tabs #view { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ---------- headers ---------- */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 18px; }
@media (display-mode: standalone) { .appbar { padding-top: calc(16px + env(safe-area-inset-top, 0px)); } }
.eyebrow { margin: 0 0 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
.h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em; text-wrap: balance; }
.subhead { justify-content: flex-start; padding-left: 0; margin-left: -10px; gap: 4px; }
.subhead h1 { margin: 0; flex: 1; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.subhead-r { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; transition: background-color .2s, transform .15s var(--ease); }
.icon-btn:hover { background: var(--divider); }
.icon-btn.outline { background: var(--surface); border: 1px solid var(--line); }
.icon-btn.filled { background: var(--accent); color: var(--on-accent); }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 11px; }
.icon-btn.danger { color: var(--bad); }
.icon-btn:disabled { opacity: .3; }
.icon-spacer { width: 44px; flex: none; }
.press { transition: transform .14s var(--ease), background-color .2s, color .2s, border-color .2s, box-shadow .2s; }
.press:active:not(:disabled) { transform: scale(.97); }

/* ---------- text ---------- */
.muted { color: var(--muted); margin: 0; }
.sm { font-size: 13px; }
.tiny { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.accent { color: var(--accent-ink); }
.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .01em; }
.big { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.mid { display: block; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.headline { margin: 2px 0 4px; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.in { color: var(--good); }
.pad-t { padding-top: 8px; }
.pad { padding: 16px 4px; }
.section-label { margin: 8px 4px -4px; font-size: 13px; font-weight: 800; color: var(--muted); }
.hint { display: flex; gap: 8px; align-items: flex-start; margin: 0 4px; font-size: 12.5px; line-height: 1.45; font-weight: 600; color: var(--muted); }
.hint .ic { margin-top: 1px; }
.foot-note { margin: 12px 0 0; text-align: center; font-size: 12px; line-height: 1.6; font-weight: 600; color: var(--muted); }
.note-box { margin: 0; padding: 14px 16px; border-radius: 16px; border: 1px dashed var(--line); font-size: 13.5px; line-height: 1.5; font-weight: 600; color: var(--muted); }
.note-box.warn { border-style: solid; border-color: transparent; background: var(--warn-soft); color: var(--warn); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow-sm); }
.card.center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; margin-bottom: 12px; }
.card-title { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.list-card { padding: 4px 16px; }
.list-card .card-head { margin: 12px 0 2px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair .divl { padding-left: 14px; border-left: 1px solid var(--divider); }
.summary3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 16px 18px; }
.summary3 .r { text-align: right; }
.tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-width: 0; color: var(--ink); text-align: left; font: inherit; }
button.stat:hover { border-color: var(--accent-ink); }
.stat .tiny { margin-top: 2px; }
.stat-go { position: absolute; bottom: 14px; right: 10px; color: var(--faint); display: flex; transition: transform .2s var(--ease), color .2s; }
button.stat:active .stat-go, button.stat:hover .stat-go { transform: translateX(2px); color: var(--accent-ink); }
.stat .mid { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); font-size: 14px; }
.kv span { color: var(--muted); font-weight: 600; }
.kv b { text-align: right; font-variant-numeric: tabular-nums; }
.welcome { display: flex; flex-direction: column; gap: 10px; }

/* ---------- banners & alerts ---------- */
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: var(--accent-soft); color: var(--ink); }
.banner .ic { color: var(--accent-ink); }
.banner p { margin: 0; flex: 1; font-size: 13.5px; line-height: 1.4; font-weight: 600; }
.banner.warn { background: var(--warn-soft); }
.banner.warn .ic { color: var(--warn); }
.alert { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); transition: opacity .2s, transform .2s var(--ease); }
.alert.leaving { opacity: 0; transform: translateX(16px); }
.alert-ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--accent-soft); color: var(--accent-ink); }
.alert.warn .alert-ic { background: var(--warn-soft); color: var(--warn); }
.alert-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border: 0; background: none; text-align: left; font-size: 13px; line-height: 1.35; color: var(--muted); font-weight: 600; }
.alert-main b { color: var(--ink); font-size: 14px; }

/* ---------- hero balance ---------- */
.hero { background: var(--hero); color: #FFFFFF; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.hero-label { font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .9); }
.hero-eye { width: 44px; height: 44px; margin: -10px -10px -10px 0; border: 0; border-radius: 14px; background: var(--hero-chip); color: #FFFFFF; display: flex; align-items: center; justify-content: center; }
.hero-amt { font-size: 40px; line-height: 46px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; transition: opacity .14s var(--ease-soft), transform .14s var(--ease-soft), filter .14s; }
.hero-amt.masked { letter-spacing: .06em; }
.hero-amt.swap { opacity: 0; transform: translateY(4px); filter: blur(4px); }
.hero-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero-sub { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .9); }
.hero-btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: 0; border-radius: 14px; background: #FFFFFF; color: #2F55D4; font-size: 13px; font-weight: 800; }

/* ---------- pills, legends ---------- */
.pill { display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; margin: 12px 0 2px; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.legend.top { margin: -4px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; }
.sw-out { background: var(--chart-out); }
.sw-in { background: var(--chart-in); }
.legend.top .sw, .tip-row .sw-in, .tip-row .sw-out { height: 10px; width: 10px; border-radius: 3px; }
.sw-avg { height: 0; border-top: 2px dashed var(--chart-avg); border-radius: 0; }
.sw-proj { height: 0; border-top: 2px dotted var(--chart-out); border-radius: 0; }
.link-row { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; height: 44px; margin: 10px 0 -8px; border: 0; border-top: 1px solid var(--divider); background: none; color: var(--accent-ink); font-size: 14px; font-weight: 700; }
.link { border: 0; background: none; padding: 10px 4px; margin: -10px -4px; color: var(--accent-ink); font-size: 13.5px; font-weight: 700; }

/* ---------- segmented control ---------- */
.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding: 4px; border-radius: 16px; background: var(--seg); }
.seg-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n)); border-radius: 12px; background: var(--seg-pill); box-shadow: 0 1px 4px rgba(14, 19, 36, .12); transform: translateX(calc(var(--i) * 100%)); transition: transform .38s var(--ease); }
.seg button { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 42px; border: 0; background: none; border-radius: 12px; color: var(--muted); font-size: 14px; font-weight: 700; transition: color .25s; white-space: nowrap; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg-sm { border-radius: 13px; padding: 3px; }
.seg-sm .seg-pill { top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n)); border-radius: 10px; }
.seg-sm button { height: 38px; padding: 0 14px; font-size: 12.5px; }

/* ---------- chips ---------- */
.chips { display: flex; gap: 8px; }
.chips.wrap { flex-wrap: wrap; }
.scroll-x { overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px; scroll-padding: 0 20px; }
.scroll-x::-webkit-scrollbar { display: none; }
.chip { position: relative; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background-color .2s, border-color .2s, color .2s, transform .14s var(--ease); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cat-chip { height: 46px; padding: 0 14px 0 5px; border-radius: 16px; }
.cat-chip.on { background: var(--accent-soft); border-color: var(--accent-ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent-ink); }
.cat-chip.pulse { animation: pulse .5s var(--ease); }
@keyframes pulse { 40% { transform: scale(1.06); } }

/* ---------- category tiles ---------- */
.tile { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--c-slate-bg); color: var(--c-slate-fg); }
.tile-sm { width: 34px; height: 34px; border-radius: 11px; }
.tile-lg { width: 56px; height: 56px; border-radius: 18px; }
.tile-xl { width: 64px; height: 64px; border-radius: 22px; margin-bottom: 4px; }
.c-blue { background: var(--c-blue-bg); color: var(--c-blue-fg); }
.c-indigo { background: var(--c-indigo-bg); color: var(--c-indigo-fg); }
.c-purple { background: var(--c-purple-bg); color: var(--c-purple-fg); }
.c-teal { background: var(--c-teal-bg); color: var(--c-teal-fg); }
.c-green { background: var(--c-green-bg); color: var(--c-green-fg); }

/* Money Tracker — shared helpers: escaping, money (integer pence), dates (local YYYY-MM-DD), icons */
(function () {
  'use strict';
  const MT = (window.MT = window.MT || {});
  const U = (MT.util = {});

  U.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  U.uid = (prefix) => (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ---------- Money: always integer pence, never floats ---------- */
  U.fmt = (pence, opts) => {
    const o = opts || {};
    const p = Math.round(pence || 0);
    const neg = p < 0;
    const abs = Math.abs(p);
    const pounds = Math.floor(abs / 100).toLocaleString('en-GB');
    const pp = String(abs % 100).padStart(2, '0');
    const sign = neg ? '−' : o.plus && p > 0 ? '+' : '';
    return sign + '£' + pounds + '.' + pp;
  };
  U.fmtSigned = (tx) => (tx.type === 'income' ? '+' : '−') + U.fmt(tx.amount);
  U.fmtShort = (pence) => {
    const v = Math.abs(pence) / 100;
    if (v >= 1000) return '£' + (Math.round(v / 100) / 10).toString().replace(/\.0$/, '') + 'k';
    return '£' + Math.round(v);
  };
  /* Parse "12", "12.4", "£1,204.50", ".5" -> pence, or null when not a valid amount */
  U.parseMoney = (str) => {
    const clean = String(str == null ? '' : str).replace(/[£,\s]/g, '');
    if (!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(clean)) return null;
    const parts = clean.split('.');
    const whole = parts[0] ? Number(parts[0]) : 0;
    const frac = Number(((parts[1] || '') + '00').slice(0, 2));
    if (!Number.isSafeInteger(whole)) return null;
    return whole * 100 + frac;
  };
  /* Keypad string ("12.4") -> pence */
  U.keypadPence = (s) => U.parseMoney(s) || 0;
  U.keypadDisplay = (s) => {
    const parts = String(s).split('.');
    const whole = Number(parts[0] || 0).toLocaleString('en-GB');
    return '£' + whole + (parts.length > 1 ? '.' + parts[1] : '');
  };
  U.penceToInput = (p) => (p / 100).toFixed(2);

  /* ---------- Dates: local calendar dates as YYYY-MM-DD strings ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  U.iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  U.parse = (s) => {
    const a = s.split('-').map(Number);
    return new Date(a[0], a[1] - 1, a[2]);

  U.today = () => U.iso(new Date());
  U.addDays = (s, n) => {
    const d = U.parse(s);
    d.setDate(d.getDate() + n);
    return U.iso(d);
  };
  U.dim = (y, m0) => new Date(y, m0 + 1, 0).getDate();
  U.monthStart = (s) => s.slice(0, 8) + '01';
  U.monthEnd = (s) => {
    const d = U.parse(s);
    return s.slice(0, 8) + pad(U.dim(d.getFullYear(), d.getMonth()));
  };
  U.addMonths = (s, n, anchorDay) => {
    const d = U.parse(s);
    const day = anchorDay || d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    t.setDate(Math.min(day, U.dim(t.getFullYear(), t.getMonth())));
    return U.iso(t);

  U.weekStart = (s, ws) => {

    return U.addDays(s, -diff);

  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
